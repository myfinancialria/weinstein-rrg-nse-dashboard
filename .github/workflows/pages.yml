name: Publish dashboard

on:
  push:
    branches: [main]
    # The "Commit refreshed dashboard data" step below pushes these exact
    # paths back to main. Without this filter that push re-triggers the
    # workflow, and the resulting overlapping runs raced each other on both
    # `git push` (non-fast-forward) and the GitHub Pages deployment
    # ("Deployment failed, try again later."). Ignoring the auto-generated
    # artefacts breaks the self-trigger loop; real code/HTML pushes still run.
    paths-ignore:
      - 'dashboard/*.json'
      - 'dashboard/sector-leadership.html'
      - 'reports/*.json'
  schedule:
    # 9:00 PM IST, Monday to Friday. Market holidays are skipped by the data
    # provider returning unchanged/empty data; the dashboard still publishes.
    - cron: "30 15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh dashboard data and market blog
        env:
          GIFT_NIFTY_LEVEL: ${{ secrets.GIFT_NIFTY_LEVEL }}
          GIFT_NIFTY_SYMBOL: ${{ secrets.GIFT_NIFTY_SYMBOL }}
          # Optional: screener.in premium sessionid cookie. When set, populates
          # the drawer's revenue-by-segment pie; absent = graceful no-op.
          SCREENER_SESSION_COOKIE: ${{ secrets.SCREENER_SESSION_COOKIE }}
        run: |
          # Recompute Weinstein stage + RRG for every industry/stock from live
          # prices (seeded from the committed industries_seed.csv), then rebuild
          # the stage-2 leading + products workbooks. Runs on the daily schedule
          # and manual dispatch — NOT on every code push (the Screener scrape is
          # slow and rate-limit-prone). Best-effort: if Screener throttles it,
          # the || keeps the last good reports and still refreshes prices/charts.
          if [ "${{ github.event_name }}" != "push" ]; then
            python analyze_screener_industries.py --workbook industries_seed.csv --config config.yaml --output-dir reports --sleep 1.5 --retries 5 --backoff 10 || echo "::warning::industry RRG/Weinstein scan failed (Screener rate-limit?) — using previous reports"
            python create_stage2_leading_workbook.py || echo "::warning::stage2 leading workbook step failed"
            python add_common_products_to_workbook.py || echo "::warning::products workbook step failed"
          else
            echo "push event — skipping the heavy industry scan; using the latest committed reports"
          fi
          python build_dashboard_data.py
          python build_sector_report.py
          python generate_market_blog.py

      # Plain-English "why it's strong" write-ups via Qwen + Llama (OpenRouter).
      # Cached in reports/ai_writeups_cache.json, so only new/changed items cost tokens.
      # If OPENROUTER_API_KEY is not set, this is a no-op (writes cached results only).
      - name: Generate AI write-ups (Qwen + Llama)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python generate_ai_writeups.py

      - name: Commit refreshed dashboard data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update daily dashboard data"
          file_pattern: dashboard/*.json dashboard/sector-leadership.html reports/*.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # GitHub's Pages backend occasionally stalls; give the deploy a
          # longer window and more retries so a transient slow deploy doesn't
          # abort with "Timeout reached" and freeze the site on stale data.
          timeout: 1200000
          error_count: 25
