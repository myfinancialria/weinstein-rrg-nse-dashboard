<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>myfinancial · Weinstein · RRG</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#060c09; --panel:#0C1610; --panel2:#101C14; --line:#1B2B21; --ink:#FFFFFF;
    --ink2:#93A79A; --ink3:#61756A; --accent:#22c55e; --accentInk:#03110a;
    --accentSoft:rgba(34,197,94,0.12); --amber:#fbbf24; --red:#ef4444; --chip:#132018;
  }
  :root[data-theme="light"]{
    --bg:#F3F6F3; --panel:#FFFFFF; --panel2:#F0F4F0; --line:#DFE7E1; --ink:#03110a;
    --ink2:#4E5F55; --ink3:#87968C; --accent:#16a34a; --accentInk:#FFFFFF;
    --accentSoft:rgba(22,163,74,0.1); --amber:#b45309; --red:#dc2626; --chip:#EDF3EE;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;
    color:var(--ink);font-variant-numeric:tabular-nums}
  a{color:var(--accent);text-decoration:none}a:hover{color:var(--accent)}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:8px}
  :root[data-theme="light"] ::-webkit-scrollbar-thumb{background:rgba(0,0,0,0.14)}
  .hoverline:hover{background:var(--panel2)}
  .hoverborder:hover{border-color:var(--accent)!important}
  .navpill:hover{color:var(--ink)!important}
</style>
</head>
<body>
<div id="root" style="min-height:100vh;background:var(--bg);color:var(--ink);">
  <div id="app" style="min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--ink3)">Loading myfinancial…</div>
</div>

<script>
"use strict";
(function(){
  // ---------------- state ----------------
  var state = {
    screen:'market', prev:'market', theme:'dark',
    sort:'rs', dir:-1, query:'', filters:{stage2:true,vol:false,fund:false,star:false},
    industry:null, sel:null, palette:false, hover:null, tf:'W', bt:'weekly', chartIvl:'weekly',
    stars: load('mf_stars', {}),
    data:null, upstox:null, blog:null, ai:null, charts:{}, chartWanted:null, loaded:false, err:null
  };

  function load(k, d){ try{ return JSON.parse(localStorage.getItem(k)) || d; }catch(e){ return d; } }
  function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

  // ---------------- data load ----------------
  function fetchJson(u){ return fetch(u).then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; }); }
  Promise.all([
    fetchJson('./dashboard_data.json'),
    fetchJson('./upstox_data.json'),
    fetchJson('./market_blog.json'),
    fetchJson('./ai_writeups.json')
  ]).then(function(res){
    if(!res[0]){ state.err = 'Could not load dashboard_data.json'; render(); return; }
    state.data = res[0]; state.upstox = res[1]||{}; state.blog = res[2]||{}; state.ai = res[3]||{};
    state.loaded = true;
    var st = stockList();
    state.sel = (st[0] && st[0].sym) || null;
    render();
  });

  // ---------------- mapping ----------------
  function stockList(){
    if(!state.data) return [];
    return (state.data.stocks||[]).filter(function(s){ return s.level==='stock'; }).map(mapStock);
  }
  function mapStock(s){
    var sym = s.display_symbol || String(s.symbol||'').replace(/\.NS$/i,'');
    var w30 = (s.weekly_ma && s.cmp) ? (s.cmp - s.weekly_ma)/s.weekly_ma*100 : null;
    return {
      sym:sym, nsym:s.symbol||sym, name:s.name||sym, ind:s.parent||s.sector||'',
      ltp:num(s.cmp!=null?s.cmp:s.close), chg:num(s.return_1w), rs:num(s.rs_ratio), rsm:num(s.rs_momentum),
      fund:s.fundamental_score, stageN:stageNum(s.stage), stageRaw:s.stage, quad:(s.rrg_quadrant||'').toLowerCase(),
      w30:w30, above52:num(s.pct_above_52wh), hasOptions:!!s.has_options,
      pe:s.pe_ratio, roce:s.roce, roe:s.roe_pct, mcap:s.market_cap_cr, netm:s.net_margin_pct, opm:s.operating_margin_pct,
      eps:s.eps, de:s.debt_to_equity, promoter:s.promoter_or_insider_holding_pct, divy:s.dividend_yield_pct,
      r:{ '1W':s.return_1w,'1M':s.return_1m,'3M':s.return_3m,'6M':s.return_6m,'1Y':s.return_1y,'3Y':s.return_3y,'5Y':s.return_5y },
      entry:s.entry_price, sl:s.sl, target:s.target, high52:s.high_52w, wma:s.weekly_ma,
      pros:s.pros, redFlags:s.red_flags, swot:s.swot, since:s.breakout_week||null, _raw:s
    };
  }
  function num(v){ return (v===null||v===undefined||v==='')?null:Number(v); }
  function stageNum(s){ if(!s) return 0; var m=String(s).match(/(\d)/); return m?+m[1]:0; }
  function stockBy(sym){ var l=stockList(); for(var i=0;i<l.length;i++) if(l[i].sym===sym) return l[i]; return l[0]; }

  var QUAD_COLOR = { leading:'--accent', improving:'--amber', lagging:'--red', weakening:'--ink3' };
  function industryList(){
    if(!state.data) return [];
    return (state.data.industries||[]).map(function(i){
      var rsr = num(i.rs_ratio)||100, rsm = num(i.rs_momentum)||100;
      var x = clamp(50 + (rsr-100)*7, 5, 95), y = clamp(50 - (rsm-100)*7, 5, 95);
      var q = (i.rrg_quadrant||'weakening').toLowerCase();
      return { name:i.name, rsr:rsr, rsm:rsm, quad:q, n:i.member_count||0, x:x, y:y,
        color:'var('+(QUAD_COLOR[q]||'--ink3')+')',
        glow: q==='leading'?'rgba(34,197,94,0.15)':q==='improving'?'rgba(251,191,36,0.13)':q==='lagging'?'rgba(239,68,68,0.12)':'rgba(140,160,150,0.12)' };
    });
  }
  function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

  // ---------------- formatting ----------------
  function fmt(n){ if(n===null||n===undefined||isNaN(n)) return '—'; return Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function fmt0(n){ if(n===null||n===undefined||isNaN(n)) return '—'; return Number(n).toLocaleString('en-IN',{maximumFractionDigits:0}); }
  function pct(n){ if(n===null||n===undefined||isNaN(n)) return '—'; return (n>0?'+':n<0?'−':'')+Math.abs(n).toFixed(2)+'%'; }
  function cr(n){ if(n===null||n===undefined||isNaN(n)) return '—'; var a=Math.abs(n); return a>=1e5?(n/1e5).toFixed(2)+'L Cr':fmt0(n)+' Cr'; }
  function money(n){ if(n===null||n===undefined||isNaN(n)) return '—'; return '₹'+fmt0(n); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function col(n){ return n>=0?'var(--accent)':'var(--red)'; }
  function poly(vals,w,h,pad){
    if(!vals||!vals.length) return '';
    var mn=Math.min.apply(null,vals), mx=Math.max.apply(null,vals), rg=(mx-mn)||1;
    return vals.map(function(v,i){ var x=(i/(vals.length-1))*w; var y=h-pad-((v-mn)/rg)*(h-pad*2); return x.toFixed(1)+','+y.toFixed(1); }).join(' ');
  }
  function ma(vals,k){ return vals.map(function(_,i){ var s=vals.slice(Math.max(0,i-k+1),i+1); return s.reduce(function(a,b){return a+b;},0)/s.length; }); }
  function starChar(sym){ return state.stars[sym]?'★':'☆'; }
  function starColor(sym){ return state.stars[sym]?'var(--accent)':'var(--ink3)'; }
  function quadColor(q){ return q==='weakening'?'var(--ink2)':'var('+(QUAD_COLOR[q]||'--ink3')+')'; }
  function stageColor(n){ return n>=2?'var(--accent)':n===1?'var(--amber)':'var(--red)'; }

  // ---------------- theme ----------------
  function applyTheme(){ document.documentElement.setAttribute('data-theme', state.theme); }

  // ---------------- charts ----------------
  function chartFile(nsym){ return String(nsym||'').replace(/\.NS$/i,'').replace(/[^A-Za-z0-9_-]/g,'_'); }
  function wantChart(st){
    var f = chartFile(st.nsym);
    if(state.charts[f]!==undefined) return;
    state.charts[f] = null; // pending
    fetchJson('./charts/'+f+'.json').then(function(d){ state.charts[f] = d||{__missing:true}; if(state.screen==='stock') render(); });
  }
  function chartSeries(st){
    var f = chartFile(st.nsym), c = state.charts[f];
    if(!c || c.__missing) return null;
    var arr = state.chartIvl==='daily' ? (c.daily||c.weekly) : (c.weekly||c.daily);
    if(!arr || !arr.length) return null;
    return arr.map(function(b){ return b.close!=null?+b.close:(b.c!=null?+b.c:+b); }).filter(function(x){return !isNaN(x);});
  }

  // ================= RENDER =================
  function render(){
    var root = document.getElementById('root');
    applyTheme();
    if(state.err){ document.getElementById('app').innerHTML = '<div style="padding:60px;text-align:center;color:var(--red)">'+esc(state.err)+'</div>'; return; }
    if(!state.loaded){ return; }
    var html = nav();
    var s = state.screen;
    if(s==='market') html += screenMarket();
    else if(s==='screener') html += screenScreener();
    else if(s==='rrg') html += screenRrg();
    else if(s==='stock') html += screenStock();
    else if(s==='backtest') html += screenBacktest();
    else if(s==='blog') html += screenBlog();
    if(state.palette) html += palette();
    root.innerHTML = html;
    // focus palette input
    if(state.palette){ var pi=document.getElementById('paletteInput'); if(pi){ pi.focus(); pi.value=state.query; } }
  }

  // ---------- nav ----------
  function nav(){
    var items = [['market','Market'],['screener','Screener'],['rrg','RRG'],['backtest','Backtests'],['blog','Blog']];
    var links = items.map(function(it){
      var on = state.screen===it[0] || (it[0]==='screener' && state.screen==='stock');
      return '<div class="navpill" data-act="go" data-arg="'+it[0]+'" style="font-size:13.5px;font-weight:'+(on?'700':'500')+';color:'+(on?'var(--ink)':'var(--ink2)')+';background:'+(on?'var(--chip)':'transparent')+';padding:7px 14px;border-radius:99px;cursor:pointer;">'+it[1]+'</div>';
    }).join('');
    var meta = state.data && state.data.metrics || {};
    return ''+
    '<div style="position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:24px;height:60px;padding:0 28px;background:var(--bg);border-bottom:1px solid var(--line);">'+
      '<div style="display:flex;align-items:center;gap:28px;">'+
        '<span style="display:inline-flex;align-items:baseline;font-size:19px;letter-spacing:-0.02em;line-height:1;"><span style="font-weight:500;color:var(--ink2);">my</span><span style="font-weight:800;color:var(--ink);border-bottom:2px solid var(--accent);padding-bottom:2px;">financial</span></span>'+
        '<span style="font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--ink3);font-weight:600;">Weinstein · RRG · NSE</span>'+
      '</div>'+
      '<div style="display:flex;align-items:center;gap:4px;">'+links+'</div>'+
      '<div style="display:flex;align-items:center;gap:10px;">'+
        '<div class="hoverborder" data-act="palette" style="display:flex;align-items:center;gap:10px;height:34px;padding:0 10px 0 13px;border:1px solid var(--line);border-radius:99px;background:var(--panel);cursor:pointer;width:210px;">'+
          '<span style="font-size:13px;color:var(--ink3);">Search symbol…</span>'+
          '<span style="margin-left:auto;font-size:10.5px;font-weight:600;color:var(--ink3);border:1px solid var(--line);border-radius:5px;padding:2px 6px;">⌘K</span></div>'+
        '<div class="hoverborder" data-act="theme" style="width:34px;height:34px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:99px;background:var(--panel);cursor:pointer;font-size:14px;color:var(--ink2);">'+(state.theme==='dark'?'☾':'☀')+'</div>'+
        '<div style="width:34px;height:34px;border-radius:99px;background:var(--accent);color:var(--accentInk);display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;">m</div>'+
      '</div>'+
    '</div>';
  }

  function card(inner, span, extra){ return '<div style="grid-column:span '+span+';background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;'+(extra||'')+'">'+inner+'</div>'; }
  function label(t){ return '<span style="font-size:11px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--ink3);">'+t+'</span>'; }

  // ---------- MARKET ----------
  function screenMarket(){
    var m = state.data.metrics||{}, b = state.blog||{}, ni = b.nifty||{};
    var st = stockList();
    var stage2 = st.filter(function(s){ return s.stageN>=2; });
    var leaders = (state.data.leadingStocks||[]).map(mapStock);
    var top = stage2.slice().sort(function(a,b){ return (b.rs||0)-(a.rs||0); }).slice(0,6);
    var inds = industryList();
    var recent = (b.recent_nifty||[]).map(function(x){ return +x.close; });
    var spark = recent.length ? recent : [ni.ma200,ni.ma50,ni.ma20,ni.close].filter(function(x){return x!=null;});
    var niftyChg = ni.change_5d_pct;

    var out = '<div style="max-width:1360px;margin:0 auto;padding:26px 28px 60px;display:flex;flex-direction:column;gap:16px;">';
    // hero
    out += '<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:20px;">'+
      '<div style="display:flex;flex-direction:column;gap:7px;">'+
        '<div style="display:flex;align-items:center;gap:9px;">'+
          '<span style="width:7px;height:7px;border-radius:5px;background:var(--accent);"></span>'+
          '<span style="font-size:11.5px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:var(--accent);">'+(stage2.length>=st.length*0.3?'Risk-on · Stage 2 broadening':'Selective · watch breadth')+'</span>'+
          '<span style="font-size:12px;color:var(--ink3);">'+esc(m.generated_at||'')+'</span></div>'+
        '<h1 style="margin:0;font-size:34px;font-weight:800;letter-spacing:-0.03em;line-height:1.15;max-width:820px;">'+stage2.length+' of '+(m.stocks_analyzed||st.length)+' names cleared Stage 2 — <span style="color:var(--accent);">'+(m.stage2_leading_stocks||leaders.length)+' in leading industries.</span></h1></div>'+
      '<div style="display:flex;gap:9px;">'+
        '<div data-act="go" data-arg="screener" style="font-size:13.5px;font-weight:700;color:var(--accentInk);background:var(--accent);padding:11px 20px;border-radius:99px;cursor:pointer;white-space:nowrap;">'+stage2.length+' stocks pass →</div>'+
        '<div data-act="go" data-arg="blog" style="font-size:13.5px;font-weight:600;color:var(--ink);border:1px solid var(--line);padding:11px 20px;border-radius:99px;cursor:pointer;white-space:nowrap;">Morning brief</div></div></div>';

    out += '<div style="display:grid;grid-template-columns:repeat(12,1fr);gap:16px;">';
    // nifty
    out += card(
      '<div style="display:flex;align-items:center;justify-content:space-between;">'+label('Nifty 50')+'<span style="font-size:11.5px;color:var(--ink3);">20d '+pct(ni.change_20d_pct)+' · RSI '+(ni.rsi14!=null?ni.rsi14.toFixed(0):'—')+'</span></div>'+
      '<div style="display:flex;align-items:baseline;gap:11px;margin-top:12px;"><span style="font-size:32px;font-weight:800;letter-spacing:-0.03em;">'+fmt(ni.close)+'</span><span style="font-size:14px;font-weight:600;color:'+col(niftyChg)+';">'+pct(niftyChg)+' · 5d</span></div>'+
      '<svg viewBox="0 0 320 86" preserveAspectRatio="none" style="width:100%;height:86px;display:block;margin-top:10px;"><polyline points="'+poly(spark,320,86,8)+' 320,86 0,86" fill="var(--accent)" opacity="0.1" stroke="none" /><polyline points="'+poly(spark,320,86,8)+'" fill="none" stroke="var(--accent)" stroke-width="1.8" /></svg>'+
      '<div style="display:flex;gap:22px;padding-top:10px;margin-top:6px;border-top:1px solid var(--line);">'+
        miniStat('20-DMA', fmt0(ni.ma20))+miniStat('50-DMA', fmt0(ni.ma50))+miniStat('200-DMA', fmt0(ni.ma200))+'</div>', 5);
    // breadth / stage2 stats
    var above52 = m.stocks_above_52w_high||0;
    out += card(label('Participation')+
      '<div style="display:flex;gap:3px;height:9px;border-radius:99px;overflow:hidden;margin-top:14px;"><div style="width:'+(stage2.length/Math.max(1,st.length)*100).toFixed(0)+'%;background:var(--accent);"></div><div style="flex:1;background:var(--red);opacity:0.4;"></div></div>'+
      '<div style="display:flex;flex-direction:column;gap:9px;margin-top:14px;">'+
        rowKV('Stage 2 stocks', stage2.length+' / '+(m.stocks_analyzed||st.length))+
        rowKV('In leading industries', String(m.stage2_leading_stocks||leaders.length))+
        rowKV('New 52-week highs', String(above52))+
        rowKV('Leading industries', String((state.data.leadingIndustries||[]).length))+'</div>', 3);
    // stage 2 hero number
    out += card(label('Stage 2 universe')+
      '<div style="display:flex;align-items:baseline;gap:10px;margin-top:6px;"><span style="font-size:52px;font-weight:800;letter-spacing:-0.04em;color:var(--accent);line-height:1;">'+stage2.length+'</span><span style="font-size:16px;font-weight:500;color:var(--ink2);">/ '+(m.stocks_analyzed||st.length)+'</span></div>'+
      '<div style="display:flex;gap:20px;margin-top:12px;">'+
        heroStat(String(m.stage2_leading_stocks||leaders.length),'in leaders','var(--accent)')+
        heroStat(String(above52),'52w highs','var(--amber)')+
        heroStat(String((state.data.breakout52wStocks||[]).length),'fresh breakouts','var(--ink)')+'</div>'+
      '<span style="font-size:12.5px;color:var(--ink2);line-height:1.5;margin-top:12px;display:block;">'+esc((m.coverage_note||'').slice(0,120))+'</span>',
      4, 'background:linear-gradient(180deg, rgba(34,197,94,0.14) 0%, rgba(34,197,94,0.04) 100%);border-color:rgba(34,197,94,0.3);');

    // RRG mini
    out += card(
      '<div style="display:flex;align-items:center;justify-content:space-between;">'+label('RRG · industries')+'<span data-act="go" data-arg="rrg" style="font-size:12px;color:var(--accent);cursor:pointer;">Open full RRG →</span></div>'+
      rrgBox(inds, 250, false)+
      '<div style="display:flex;gap:16px;font-size:11.5px;color:var(--ink3);margin-top:14px;">'+quadLegend(inds)+'</div>', 5);

    // top of screen
    out += card(
      '<div style="display:flex;align-items:center;justify-content:space-between;">'+label('Top of the screen')+'<span data-act="go" data-arg="screener" style="font-size:12px;color:var(--accent);cursor:pointer;">All '+stage2.length+' →</span></div>'+
      '<div style="display:grid;grid-template-columns:22px 1.1fr 1.1fr 88px 74px 68px 96px;gap:10px;padding:12px 0 9px;border-bottom:1px solid var(--line);font-size:10.5px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink3);"><span></span><span>Symbol</span><span>Industry</span><span style="text-align:right;">LTP</span><span style="text-align:right;">RS</span><span style="text-align:right;">1W</span><span style="text-align:right;">Stage</span></div>'+
      top.map(function(r){ return topRow(r); }).join(''), 7);

    // blog teaser
    out += card(label('Morning brief')+
      '<span style="font-size:18px;font-weight:700;letter-spacing:-0.02em;line-height:1.3;display:block;margin-top:9px;">'+esc((b.headline||'Daily market brief').slice(0,120))+'</span>'+
      '<div style="display:flex;gap:16px;margin-top:10px;">'+
        miniStat('Pivot', fmt0((b.cpr||{}).pivot))+miniStat('R1', fmt0((b.cpr||{}).r1),'var(--accent)')+miniStat('S1', fmt0((b.cpr||{}).s1),'var(--red)')+'</div>',
      4, 'cursor:pointer;');
    // backtest teaser
    var bw = ((state.data.backtest||{}).weekly||{}).summary||{};
    out += card(label('Backtest · 5 years (weekly)')+
      '<div style="display:flex;gap:22px;margin-top:12px;">'+
        heroStat((bw.total_pnl!=null?'₹'+fmt0(bw.total_pnl):'—'),'net P&L','var(--accent)')+
        heroStat((bw.win_rate_pct!=null?bw.win_rate_pct.toFixed(0)+'%':'—'),'win rate','var(--ink)')+
        heroStat((bw.avg_r_multiple!=null?bw.avg_r_multiple.toFixed(2)+'R':'—'),'avg R','var(--ink)')+'</div>',
      4, 'cursor:pointer;');
    // watchlist
    var watch = st.filter(function(s){ return state.stars[s.sym]; });
    out += card(
      '<div style="display:flex;align-items:center;justify-content:space-between;">'+label('Your watchlist')+'<span style="font-size:11.5px;color:var(--ink3);">'+watch.length+' starred</span></div>'+
      '<div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;">'+(watch.length?watch.map(function(w){ return '<div data-act="open" data-arg="'+esc(w.sym)+'" class="hoverborder" style="display:flex;align-items:center;gap:8px;background:var(--chip);border:1px solid var(--line);border-radius:99px;padding:6px 12px;cursor:pointer;"><span style="font-size:12.5px;font-weight:600;">'+esc(w.sym)+'</span><span style="font-size:12px;color:'+col(w.chg)+';">'+pct(w.chg)+'</span></div>'; }).join(''):'<span style="font-size:12.5px;color:var(--ink3);">Star any row in the screener to track it here.</span>')+'</div>', 4);

    out += '</div></div>';
    return out;
  }

  // ---------- Upstox section (options / fundamentals / FII-DII) ----------
  function uxSection(s){
    var ux = state.upstox||{};
    var f = (ux.fundamentals||{})[s.sym];
    var o = (ux.options||{})[s.sym];
    if(!f && !o && !ux.fii_dii) return '';
    var blocks = '';
    if(o) blocks += uxOptions(o);
    if(f) blocks += uxFund(f);
    if(ux.fii_dii) blocks += uxFlows(ux.fii_dii);
    if(!blocks) return '';
    return '<div style="background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px;">'+label('Upstox · options, financials & institutional flows')+blocks+'</div>';
  }
  function uxOptions(o){
    var strikes=(o.oi_by_strike||[]).filter(function(x){return x.strike!=null;}), bars='';
    if(strikes.length){ var maxOI=Math.max.apply(null,[1].concat(strikes.map(function(x){return Math.max(x.call_oi||0,x.put_oi||0);})));
      var near = o.max_pain?strikes.slice().sort(function(a,b){return Math.abs(a.strike-o.max_pain)-Math.abs(b.strike-o.max_pain);}).slice(0,9).sort(function(a,b){return a.strike-b.strike;}):strikes.slice(0,9);
      bars='<table style="width:100%;border-collapse:collapse;font-size:12px;margin-top:8px;"><thead><tr><th style="text-align:right;color:var(--ink3);font-weight:600;padding:2px 6px;">Call OI</th><th style="text-align:center;color:var(--ink3);font-weight:600;">Strike</th><th style="color:var(--ink3);font-weight:600;">Put OI</th></tr></thead><tbody>'+
        near.map(function(x){ var cw=((x.call_oi||0)/maxOI*100).toFixed(0),pw=((x.put_oi||0)/maxOI*100).toFixed(0),mp=o.max_pain&&Math.abs(x.strike-o.max_pain)<1e-6;
          return '<tr><td style="text-align:right;width:42%;"><span style="display:inline-block;height:9px;border-radius:3px;background:var(--red);width:'+cw+'%;"></span></td><td style="text-align:center;'+(mp?'font-weight:700;color:var(--amber);':'color:var(--ink2);')+'">'+fmt0(x.strike)+(mp?' •':'')+'</td><td style="width:42%;"><span style="display:inline-block;height:9px;border-radius:3px;background:var(--accent);width:'+pw+'%;"></span></td></tr>'; }).join('')+'</tbody></table>';
    }
    var pcrTone = o.pcr==null?'var(--ink)':o.pcr>1.1?'var(--accent)':o.pcr<0.7?'var(--red)':'var(--ink)';
    return '<div style="margin-top:6px;"><div style="font-size:12px;font-weight:700;color:var(--ink);margin-bottom:6px;">Options — current month (exp '+esc(o.expiry||'—')+')</div>'+
      '<div style="display:flex;flex-wrap:wrap;gap:8px;">'+
        uxStat((o.pcr!=null?o.pcr.toFixed(2):'—'),'PCR',pcrTone)+uxStat(fmt0(o.max_pain),'Max Pain')+uxStat(fmt0(o.spot),'Spot')+uxStat(fmt0(o.total_calls),'Call OI')+uxStat(fmt0(o.total_puts),'Put OI')+'</div>'+bars+
      '<div style="font-size:11px;color:var(--ink3);margin-top:4px;">PCR&gt;1 = put-heavy (support); &lt;0.7 = call-heavy. Max-pain • marked.</div></div>';
  }
  function uxStat(v,l,c){ return '<div style="flex:1;min-width:62px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:7px 6px;text-align:center;"><div style="font-size:15px;font-weight:700;color:'+(c||'var(--ink)')+';">'+v+'</div><div style="font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:0.03em;margin-top:2px;">'+l+'</div></div>'; }
  function uxStmt(title,rows,units){
    if(!rows||!rows.length) return '';
    var periods=(rows[0].history||[]).slice(0,4).map(function(h){return h.period;});
    var body=rows.map(function(r){ var cells=(r.history||[]).slice(0,4).map(function(h){ var chg=h.change?'<br><span style="font-size:10px;color:'+(String(h.change).trim().charAt(0)==='-'?'var(--red)':'var(--accent)')+';">'+esc(h.change)+'</span>':''; return '<td style="text-align:right;padding:4px 6px;">'+cr(h.value)+chg+'</td>'; }).join('');
      return '<tr><td style="padding:4px 6px;color:var(--ink2);text-transform:capitalize;">'+esc((r.category||'').replace(/_/g,' '))+'</td>'+cells+'</tr>'; }).join('');
    return '<div style="font-size:12px;font-weight:700;margin-top:8px;">'+title+' <span style="color:var(--ink3);font-weight:400;">₹ '+(units||'crore')+'</span></div><table style="width:100%;border-collapse:collapse;font-size:12px;"><thead><tr><th></th>'+periods.map(function(p){return '<th style="text-align:right;color:var(--ink3);font-weight:600;padding:2px 6px;">'+p+'</th>';}).join('')+'</tr></thead><tbody>'+body+'</tbody></table>';
  }
  function uxFund(f){
    var p=f.profile||{}, inc=f.income_statement||{}, bal=f.balance_sheet||{}, cf=f.cash_flow||{};
    var ratios=(f.ratios_full||[]).map(function(r){ return '<div style="display:flex;gap:6px;align-items:baseline;font-size:12.5px;padding:2px 0;"><span style="color:var(--ink2);min-width:80px;">'+esc(r.name)+'</span><b>'+esc(r.company_value)+'</b><span style="color:var(--ink3);">'+(r.sector_value!=null?'/ '+esc(r.sector_value)+' sec':'')+'</span></div>'; }).join('');
    var balRows=(bal.history||[]).slice(0,4);
    var balTable = balRows.length? '<div style="font-size:12px;font-weight:700;margin-top:8px;">Balance Sheet <span style="color:var(--ink3);font-weight:400;">₹ '+(bal.units_in||'crore')+'</span></div><table style="width:100%;border-collapse:collapse;font-size:12px;"><thead><tr><th></th>'+balRows.map(function(x){return '<th style="text-align:right;color:var(--ink3);font-weight:600;padding:2px 6px;">'+x.period+'</th>';}).join('')+'</tr></thead><tbody><tr><td style="padding:4px 6px;color:var(--ink2);">total asset</td>'+balRows.map(function(x){return '<td style="text-align:right;padding:4px 6px;">'+cr(x.total_asset)+'</td>';}).join('')+'</tr><tr><td style="padding:4px 6px;color:var(--ink2);">total liability</td>'+balRows.map(function(x){return '<td style="text-align:right;padding:4px 6px;">'+cr(x.total_liability)+'</td>';}).join('')+'</tr></tbody></table>':'';
    var holds=(f.share_holdings||[]).map(function(c){ var l=(c.history||[])[0]||{}; return '<div style="display:flex;align-items:center;gap:8px;font-size:12px;"><span style="width:120px;color:var(--ink2);text-transform:capitalize;">'+esc((c.category||'').replace(/_/g,' '))+'</span><span style="flex:1;height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;"><span style="display:block;height:100%;background:var(--accent);width:'+Math.min(100,l.value||0)+'%;"></span></span><span style="width:66px;text-align:right;">'+(l.value!=null?l.value.toFixed(2)+'%':'—')+'</span></div>'; }).join('');
    var peers=(f.competitors||[]).map(function(c){ return '<span style="background:var(--chip);border:1px solid var(--line);border-radius:99px;padding:3px 11px;font-size:12px;">'+esc(c.name||c.instrument_key)+'</span>'; }).join('');
    return '<div style="margin-top:10px;border-top:1px solid var(--line);padding-top:10px;">'+
      (p.company_profile?'<div style="font-size:12.5px;color:var(--ink2);line-height:1.6;margin-bottom:8px;">'+esc(p.company_profile)+'</div>':'')+
      (ratios?'<div style="font-size:12px;font-weight:700;">Key Ratios — vs sector</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:2px 14px;margin:4px 0;">'+ratios+'</div>':'')+
      uxStmt('Income Statement', inc.income_statement, inc.units_in)+ balTable + uxStmt('Cash Flow', cf.cash_flow, cf.units_in)+
      (holds?'<div style="font-size:12px;font-weight:700;margin-top:8px;">Shareholding — latest</div><div style="display:flex;flex-direction:column;gap:5px;margin-top:4px;">'+holds+'</div>':'')+
      (peers?'<div style="font-size:12px;font-weight:700;margin-top:8px;">Peers</div><div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:4px;">'+peers+'</div>':'')+'</div>';
  }
  function uxFlows(fd){
    if(!fd||!fd.segments) return '';
    var s=fd.segments, cash=s['NSE_EQ|CASH']||{};
    function line(l,o){ return o?'<tr><td style="padding:3px 6px;">'+l+'</td><td style="text-align:right;padding:3px 6px;color:'+col(o.net)+';">'+(o.net>=0?'+':'')+fmt0(o.net)+'</td><td style="text-align:right;padding:3px 6px;color:var(--ink3);">'+fmt0(o.buy)+' / '+fmt0(o.sell)+'</td></tr>':''; }
    return '<div style="margin-top:10px;border-top:1px solid var(--line);padding-top:10px;"><div style="font-size:12px;font-weight:700;">Institutional Flows — market-wide (₹ Cr)</div>'+
      '<table style="width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px;"><thead><tr><th style="text-align:left;color:var(--ink3);font-weight:600;padding:2px 6px;">Segment</th><th style="text-align:right;color:var(--ink3);font-weight:600;padding:2px 6px;">Net</th><th style="text-align:right;color:var(--ink3);font-weight:600;padding:2px 6px;">Buy / Sell</th></tr></thead><tbody>'+
      line('<b>FII — Cash</b>',cash.fii)+line('<b>DII — Cash</b>',cash.dii)+line('FII — Index Fut',(s['NSE_FO|INDEX_FUTURES']||{}).fii)+line('FII — Stock Fut',(s['NSE_FO|STOCK_FUTURES']||{}).fii)+line('FII — Index Opt',(s['NSE_FO|INDEX_OPTIONS']||{}).fii)+line('FII — Stock Opt',(s['NSE_FO|STOCK_OPTIONS']||{}).fii)+
      '</tbody></table><div style="font-size:11px;color:var(--ink3);margin-top:4px;">Market-wide, not per-stock. Source: Upstox market-information API.</div></div>';
  }

    var metrics = [
      ['Net P&L', sum.total_pnl!=null?'₹'+fmt0(sum.total_pnl):'—', 'var(--accent)'],

    return '<div style="max-width:1360px;margin:0 auto;padding:26px 28px 60px;display:flex;flex-direction:column;gap:16px;">'+
      '<div style="display:flex;align-items:flex-end;justify-content:space-between;"><div style="display:flex;flex-direction:column;gap:5px;"><h2 style="margin:0;font-size:26px;font-weight:800;letter-spacing:-0.03em;">Backtests</h2><span style="font-size:13px;color:var(--ink2);">Signal: RRG improving → leading. Entry above signal-candle high, stop at 30-week MA. '+esc(sum.timeframe||state.bt)+' · risk ₹'+fmt0(sum.risk_per_trade||10000)+'/trade.</span></div><div style="display:flex;gap:5px;">'+chips+'</div></div>'+

      '<div style="display:grid;grid-template-columns:1fr 400px;gap:16px;">'+

  // ================= EVENTS =================
  function go(screen){ if(state.screen!=='stock') state.prev=state.screen; state.screen=screen; state.palette=false; window.scrollTo(0,0); render(); }
  function openStock(sym){ if(state.screen!=='stock') state.prev=state.screen; state.sel=sym; state.screen='stock'; state.palette=false; window.scrollTo(0,0); render(); }
  function toggleStar(sym){ state.stars[sym]=!state.stars[sym]; if(!state.stars[sym]) delete state.stars[sym]; save('mf_stars',state.stars); render(); }

  document.addEventListener('click', function(e){
    var t=e.target.closest('[data-act]'); if(!t) return;
    var act=t.dataset.act, arg=t.dataset.arg;
    if(act==='star'){ e.stopPropagation(); toggleStar(arg); return; }
    if(act==='go') return go(arg);
    if(act==='open') return openStock(arg);
    if(act==='openind'){ state.industry=arg; go('screener'); return; }
    if(act==='back') return go(state.prev||'market');
    if(act==='theme'){ state.theme=state.theme==='dark'?'light':'dark'; render(); return; }
    if(act==='palette'){ state.palette=true; state.query=''; render(); return; }
    if(act==='closepalette'){ if(t.dataset.act==='closepalette' && !e.target.closest('[data-stop]')){ state.palette=false; render(); } return; }
    if(act==='filter'){ state.filters[arg]=!state.filters[arg]; render(); return; }
    if(act==='indfilter'){ state.industry=arg||null; render(); return; }
    if(act==='reset'){ state.filters={stage2:true,vol:false,fund:false,star:false}; state.industry=null; render(); return; }
    if(act==='sort'){ if(state.sort===arg) state.dir=-state.dir; else { state.sort=arg; state.dir=-1; } render(); return; }
    if(act==='ivl'){ state.chartIvl=arg; render(); return; }
    if(act==='bt'){ state.bt=arg; render(); return; }
  });
  document.addEventListener('input', function(e){ if(e.target && e.target.id==='paletteInput'){ state.query=e.target.value; updatePaletteResults(); } });
  document.addEventListener('keydown', function(e){
    if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); state.palette=true; state.query=''; render(); }
    if(e.key==='Escape' && state.palette){ state.palette=false; render(); }
  });
})();
</script>
</body>
</html>
