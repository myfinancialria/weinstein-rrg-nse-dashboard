<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sector leadership · myfinancial</title>
<style>
  :root{--bg:#f7f8fa;--card:#fff;--ink:#0f172a;--muted:#64748b;--faint:#94a3b8;--line:#e6e9ef;
    --up:#16a34a;--down:#dc2626;--accent:#2563eb;--soft:#f1f5f9;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.55}
  a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
  .wrap{max-width:1080px;margin:0 auto;padding:22px 20px 70px}
  .top{display:flex;justify-content:space-between;align-items:baseline;gap:14px;flex-wrap:wrap}
  h1{font-size:1.6rem;font-weight:800;letter-spacing:-.02em;margin:0}
  .lead{color:var(--muted);font-size:.9rem;margin:8px 0 18px;max-width:75ch}
  .sc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
  .sc-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .sc-h .name{font-size:1.15rem;font-weight:750}
  .pill{display:inline-block;font-size:.7rem;font-weight:600;padding:2px 10px;border-radius:999px}
  .pill.leading{background:#dcfce7;color:#166534}.pill.improving{background:#fef3c7;color:#92400e}
  .pill.weakening{background:#e2e8f0;color:#475569}.pill.lagging{background:#fee2e2;color:#991b1b}
  .stats{display:flex;gap:22px;flex-wrap:wrap;margin:10px 0}
  .stat .l{font-size:.64rem;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:600}
  .stat .v{font-weight:700;font-variant-numeric:tabular-nums}
  .analysis{font-size:.9rem;margin:6px 0 12px}
  .up{color:var(--up)}.down{color:var(--down)}.mut{color:var(--muted)}
  table{width:100%;border-collapse:collapse;font-size:.83rem}
  th,td{text-align:right;padding:6px 8px;border-top:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--faint);font-size:.64rem;text-transform:uppercase;border-top:none;font-weight:600}
  .sym{font-weight:700}
  .loading{padding:60px 0;text-align:center;color:var(--muted)}
  .foot{color:var(--faint);font-size:.75rem;margin-top:20px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>Sector leadership</h1><div style="font-size:.84rem;color:var(--muted)"><a href="index.html">← Overview</a> · <a href="screener.html">Screener</a></div></div>
  <div class="lead">Which parts of the market are strongest right now — and which are weak — measured by how each sector's stocks are doing versus the whole market (RS) and how many are in a healthy uptrend (Stage 2). Strongest first.</div>
  <div id="view"><div class="loading">Loading sectors…</div></div>
  <div class="foot" id="foot"></div>
</div>

<script src="./api_config.js"></script>
<script>
const API=(window.API_BASE||"").replace(/\/$/,"");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=n=>(n==null||isNaN(n))?"—":Number(n).toLocaleString("en-IN",{maximumFractionDigits:2});
const pct=n=>(n==null||isNaN(n))?"—":(n>=0?"+":"")+Number(n).toFixed(2)+"%";
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const q=(rr,rm)=>rr>=100?(rm>=100?"leading":"weakening"):(rm>=100?"improving":"lagging");
const ANALYSIS={
  leading:"Strong and getting stronger — this is where the market's money is flowing. The healthiest place to look for ideas.",
  improving:"Weak but turning up — early signs money is rotating in. Watch for the strongest names to break out first.",
  weakening:"Still ahead of the market but momentum is fading — leaders here may be maturing; be selective.",
  lagging:"Weak and lagging the market — mostly downtrends. Best avoided until it starts to improve.",
};

fetch(API+"/api/universe/screen").then(r=>r.json()).then(d=>render(d)).catch(e=>{
  document.getElementById("view").innerHTML=`<div class="loading">Couldn't load. ${esc(e.message)}</div>`;});

function render(d){
  const S=(d&&d.stocks)||[];
  if(!S.length){ document.getElementById("view").innerHTML='<div class="loading">The screener hasn\'t run on the server yet.</div>'; return; }
  const byI={}; S.forEach(s=>{const i=s.industry||"Other";(byI[i]=byI[i]||[]).push(s);});
  const inds=Object.entries(byI).map(([name,a])=>({name,arr:a,n:a.length,
    rr:avg(a.map(s=>s.rs_ratio).filter(v=>v!=null)),
    rm:avg(a.map(s=>s.rs_momentum).filter(v=>v!=null)),
    chg:avg(a.map(s=>s.chg_pct).filter(v=>v!=null)),
    s2:a.filter(s=>s.stage==="stage_2").length})).filter(i=>i.rr!=null).sort((x,y)=>y.rr-x.rr);
  document.getElementById("view").innerHTML=inds.map(i=>{
    const qd=q(i.rr,i.rm);
    const top=i.arr.slice().sort((a,b)=>(b.score||0)-(a.score||0)).slice(0,5);
    const rows=top.map(s=>`<tr>
      <td><a class="sym" href="stock.html?symbol=${encodeURIComponent(s.symbol)}">${esc(s.symbol)}</a></td>
      <td>${num(s.cmp)}</td><td class="${(s.chg_pct||0)>=0?'up':'down'}">${pct(s.chg_pct)}</td>
      <td>${s.rs_ratio!=null?s.rs_ratio.toFixed(1):"—"}</td>
      <td>${s.stage==="stage_2"?'<span class="pill leading">Stage 2</span>':'<span class="mut">—</span>'}</td></tr>`).join("");
    const news=`https://news.google.com/search?q=${encodeURIComponent(i.name+" sector India stocks")}&hl=en-IN&gl=IN`;
    return `<div class="sc">
      <div class="sc-h"><div class="name">${esc(i.name)}</div><span class="pill ${qd}">${qd[0].toUpperCase()+qd.slice(1)}</span></div>
      <div class="stats">
        <div class="stat"><div class="l">Stocks</div><div class="v">${i.n}</div></div>
        <div class="stat"><div class="l">In Stage 2</div><div class="v">${i.s2} <span class="mut">(${Math.round(i.s2/i.n*100)}%)</span></div></div>
        <div class="stat"><div class="l">Strength (RS)</div><div class="v">${i.rr.toFixed(1)}</div></div>
        <div class="stat"><div class="l">Momentum</div><div class="v">${i.rm!=null?i.rm.toFixed(1):"—"}</div></div>
        <div class="stat"><div class="l">Avg move today</div><div class="v ${i.chg>=0?'up':'down'}">${pct(i.chg)}</div></div>
      </div>
      <div class="analysis">${ANALYSIS[qd]}</div>
      <table><thead><tr><th>Top names</th><th>LTP</th><th>Chg</th><th>RS</th><th>Stage</th></tr></thead><tbody>${rows}</tbody></table>
      <div style="margin-top:10px;font-size:.82rem"><a href="${news}" target="_blank" rel="noopener">Latest ${esc(i.name)} news ↗</a></div>
    </div>`;
  }).join("");
  document.getElementById("foot").textContent=`${inds.length} sectors · ${S.length.toLocaleString("en-IN")} stocks · updated ${(d.generated_at||"").replace("T"," ").slice(0,16)}. Educational use only — not investment advice.`;
}
</script>
</body>
</html>
