<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>myfinancial · Stock 360</title>
<style>
  :root{
    --bg:#0d1117;--panel:#161b22;--panel2:#1c2230;--border:#2b3446;--text:#e6edf3;
    --muted:#8b98a9;--accent:#4c8dff;--green:#2ea043;--red:#e5534b;--amber:#d29922;--chip:#22283a;
  }
  @media (prefers-color-scheme:light){:root{--bg:#f6f8fa;--panel:#fff;--panel2:#eef2f7;
    --border:#d5dbe2;--text:#1c2128;--muted:#5b6570;--chip:#eef2f7;}}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
  .wrap{max-width:1040px;margin:0 auto;padding:22px 18px 72px}

  /* ---------- Google-style home ---------- */
  .hero{min-height:82vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .brand{font-size:2.6rem;font-weight:800;letter-spacing:-.03em;margin:0}
  .brand .dot{color:var(--accent)}
  .brand .three60{background:linear-gradient(90deg,var(--accent),#7b5cff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .subtitle{color:var(--muted);font-size:.95rem;margin:10px 0 30px}
  .searchbox{position:relative;width:min(620px,92vw)}
  .searchbox svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:20px;height:20px;fill:var(--muted)}
  input.bigsearch{width:100%;padding:15px 18px 15px 50px;border-radius:999px;border:1px solid var(--border);
    background:var(--panel);color:var(--text);font-size:1.05rem;box-shadow:0 2px 14px rgba(0,0,0,.14);outline:none}
  input.bigsearch:focus{border-color:var(--accent);box-shadow:0 2px 22px rgba(76,141,255,.28)}
  .ac{position:absolute;left:0;right:0;top:calc(100% + 8px);background:var(--panel);border:1px solid var(--border);
    border-radius:16px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.28);text-align:left;z-index:9;display:none}
  .ac.open{display:block}
  .aci{display:flex;align-items:center;gap:12px;padding:11px 18px;cursor:pointer;border-top:1px solid var(--border)}
  .aci:first-child{border-top:none}
  .aci.active,.aci:hover{background:var(--panel2)}
  .aci .sym{font-weight:700;min-width:96px}
  .aci .nm{color:var(--muted);font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hint{color:var(--muted);font-size:.8rem;margin-top:26px}
  .hint b{color:var(--text)}

  /* ---------- Detail ---------- */
  .topbar{display:flex;align-items:center;gap:14px;margin-bottom:16px}
  .topbar .home{font-size:1.05rem;font-weight:800;letter-spacing:-.02em;color:var(--text);white-space:nowrap}
  .topbar .home .three60{color:var(--accent)}
  .minisearch{position:relative;flex:1;max-width:460px}
  .minisearch input{width:100%;padding:9px 14px;border-radius:999px;border:1px solid var(--border);background:var(--panel);color:var(--text);font-size:.9rem}
  .updated{color:var(--muted);font-size:.78rem;margin-bottom:16px}
  .head{background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:20px 22px;margin-bottom:16px}
  .head .sym{font-size:1.5rem;font-weight:750}
  .head .nm{color:var(--muted);font-size:.92rem}
  .head .meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:10px;font-size:.82rem;color:var(--muted)}
  .head .meta b{color:var(--text)}
  .head p.desc{margin:12px 0 0;font-size:.9rem;color:var(--text);max-width:80ch}
  section{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:16px}
  section h2{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media (max-width:720px){.cols{grid-template-columns:1fr}}
  table{width:100%;border-collapse:collapse;font-size:.85rem;font-variant-numeric:tabular-nums}
  th,td{text-align:right;padding:5px 6px;border-top:1px solid var(--border)}
  th:first-child,td:first-child{text-align:left;color:var(--muted)}
  thead th{border-top:none;color:var(--muted);font-weight:600;font-size:.76rem}
  .pos{color:var(--green)}.neg{color:var(--red)}
  .ratio{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--border);font-size:.86rem}
  .ratio:first-child{border-top:none}
  .ratio .nm{width:74px;color:var(--muted)}
  .ratio .bars{flex:1;display:flex;flex-direction:column;gap:3px}
  .bar{height:7px;border-radius:4px;background:var(--panel2);position:relative;overflow:hidden}
  .bar>span{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
  .bar.co>span{background:var(--accent)}.bar.se>span{background:var(--muted)}
  .ratio .vals{width:120px;text-align:right;font-variant-numeric:tabular-nums}
  .ratio .vals .se{color:var(--muted);font-size:.76rem}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{background:var(--chip);border:1px solid var(--border);border-radius:999px;padding:3px 11px;font-size:.8rem}
  .action{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--border);font-size:.85rem}
  .action:first-child{border-top:none}
  .action .amt{color:var(--muted)}
  .news{display:grid;grid-template-columns:1fr;gap:10px}
  .na{display:flex;gap:12px;padding:10px;border:1px solid var(--border);border-radius:11px;background:var(--panel2)}
  .na img{width:96px;height:64px;object-fit:cover;border-radius:8px;flex:none;background:var(--chip)}
  .na .h{font-weight:600;font-size:.88rem}
  .na .s{color:var(--muted);font-size:.8rem;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .na .t{color:var(--muted);font-size:.72rem;margin-top:4px}
  .hold{display:flex;flex-direction:column;gap:9px}
  .hbar{display:flex;align-items:center;gap:10px;font-size:.83rem}
  .hbar .nm{width:96px;color:var(--muted);text-transform:capitalize}
  .hbar .track{flex:1;height:9px;border-radius:5px;background:var(--panel2);overflow:hidden}
  .hbar .track>span{display:block;height:100%;background:var(--accent);border-radius:5px}
  .hbar .v{width:96px;text-align:right;font-variant-numeric:tabular-nums}
  .hbar .v small{color:var(--muted)}
  .muted{color:var(--muted);font-size:.85rem}
  footer{margin-top:30px;color:var(--muted);font-size:.76rem;border-top:1px solid var(--border);padding-top:14px}
  .loading{color:var(--muted);padding:56px 0;text-align:center}
  .spin{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;
    display:inline-block;animation:sp .8s linear infinite;vertical-align:middle;margin-right:10px}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ---------- AI interpretation + warnings ---------- */
  .ai{background:linear-gradient(180deg,var(--panel),var(--panel));border:1px solid var(--border);border-left:4px solid var(--accent)}
  .ai .badge{display:inline-block;font-size:.66rem;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);
    border:1px solid var(--accent);border-radius:999px;padding:1px 9px;margin-left:8px;vertical-align:middle}
  .ai h3{font-size:.82rem;margin:14px 0 4px;color:var(--text)}
  .ai h3:first-of-type{margin-top:4px}
  .ai p{margin:0 0 4px;font-size:.92rem}
  .ai .prov{color:var(--muted);font-size:.72rem;margin-top:12px}
  .poslist{margin:6px 0 0;padding-left:18px;font-size:.9rem}
  .poslist li{margin:2px 0}
  .warns{display:flex;flex-direction:column;gap:10px}
  .warn{display:flex;gap:11px;padding:12px 14px;border-radius:11px;border:1px solid var(--border);background:var(--panel2)}
  .warn .ic{font-size:1.05rem;line-height:1.4}
  .warn .wt{font-weight:650;font-size:.9rem}
  .warn .wd{color:var(--muted);font-size:.85rem;margin-top:2px}
  .warn.high{border-color:var(--red);background:color-mix(in srgb,var(--red) 12%,var(--panel))}
  .warn.high .wt{color:var(--red)}
  .warn.medium{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 12%,var(--panel))}
  .warn.medium .wt{color:var(--amber)}
  .warn.info{border-color:var(--border)}
  .allclear{display:flex;gap:10px;align-items:center;color:var(--green);font-size:.9rem}
</style>
</head>
<body>
<div class="wrap">
  <div id="view"><div class="loading"><span class="spin"></span>Loading…</div></div>
  <footer>
    Data via the Upstox Fundamentals &amp; News APIs; interpretation by AI from those figures.
    Figures may lag and AI summaries can contain mistakes. <b>Educational use only — not investment advice.</b>
  </footer>
</div>

<script src="./api_config.js"></script>
<script>
// API base comes from api_config.js (window.API_BASE = your Stock 360 API URL).
// Empty = not configured yet; the page shows a notice instead of failing silently.
const API_BASE = (window.API_BASE || "").replace(/\/$/,"");
const api = path => API_BASE + path;
const DASHBOARD_URL = "./app.html";  // the RRG / Weinstein dashboard ("the rest")

const V = document.getElementById("view");
const num = n => (n===null||n===undefined||n==="")?"—":Number(n).toLocaleString("en-IN");
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const q = new URLSearchParams(location.search);
function chgClass(s){ if(!s) return ""; return String(s).trim().startsWith("-")?"neg":"pos"; }
function fmtCr(v){ if(v===null||v===undefined) return "—";
  const a=Math.abs(v); if(a>=100000) return (v/100000).toFixed(2)+"L Cr";
  return num(Math.round(v))+" Cr"; }

async function route(){
  const sym = q.get("symbol");
  try{ sym ? await renderStock(sym) : renderHome(); }
  catch(e){ V.innerHTML = `<div class="loading">Couldn't load ${esc(sym||"page")}. ${esc(e.message)}</div>`; }
}

/* ---------------- Typeahead (shared by home + detail) ---------------- */
function attachTypeahead(input, acEl){
  let items=[], active=-1, timer=null, seq=0;
  const close=()=>{acEl.classList.remove("open");active=-1;};
  const go=it=>{ if(it) location.href = `?symbol=${encodeURIComponent(it.symbol)}`; };
  const render=()=>{
    if(!items.length){ close(); return; }
    acEl.innerHTML = items.map((it,i)=>`<div class="aci ${i===active?'active':''}" data-i="${i}">
      <span class="sym">${esc(it.symbol)}</span><span class="nm">${esc(it.name||"")}</span></div>`).join("");
    acEl.classList.add("open");
    acEl.querySelectorAll(".aci").forEach(el=>el.addEventListener("mousedown",e=>{e.preventDefault();go(items[+el.dataset.i]);}));
  };
  input.addEventListener("input", ()=>{
    const term=input.value.trim(); clearTimeout(timer);
    if(term.length<1){ items=[]; close(); return; }
    timer=setTimeout(async()=>{
      const my=++seq;
      try{
        const r=await (await fetch(api(`/api/search?q=${encodeURIComponent(term)}`))).json();
        if(my!==seq) return;
        items=r.results||[]; active=-1; render();
      }catch(_){ items=[]; close(); }
    },140);
  });
  input.addEventListener("keydown", e=>{
    if(!items.length) return;
    if(e.key==="ArrowDown"){e.preventDefault();active=(active+1)%items.length;render();}
    else if(e.key==="ArrowUp"){e.preventDefault();active=(active-1+items.length)%items.length;render();}
    else if(e.key==="Enter"){e.preventDefault();go(items[active>=0?active:0]);}
    else if(e.key==="Escape"){close();}
  });
  input.addEventListener("blur", ()=>setTimeout(close,150));
}

/* ---------------- Home (Google-style) ---------------- */
function renderHome(){
  document.title = "myfinancial · Stock Search";
  const notice = API_BASE ? "" : `<div class="hint" style="color:var(--amber)">
    ⚠ Search backend not configured yet — set <b>window.API_BASE</b> in <b>api_config.js</b> to your Stock 360 API URL.</div>`;
  V.innerHTML = `
    <div class="hero">
      <h1 class="brand">Stock<span class="three60"> 360</span><span class="dot">.</span></h1>
      <div class="subtitle">Search any NSE-listed company — full company details, ratios, financials, plain-English interpretation, and red-flag warnings.</div>
      <div class="searchbox">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 10-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1114 9.5 4.5 4.5 0 019.5 14z"/></svg>
        <input class="bigsearch" id="q" autocomplete="off" spellcheck="false"
          placeholder="Search by company name or NSE symbol…" autofocus />
        <div class="ac" id="ac"></div>
      </div>
      <div class="hint">e.g. <b>RELIANCE</b>, <b>HDFC Bank</b>, <b>TITAN</b> · covers every NSE-listed stock · first look at a stock takes a few seconds to analyse, then it's instant.</div>
      ${notice}
      <div class="hint" style="margin-top:22px"><a href="${DASHBOARD_URL}">Open the RRG / Weinstein dashboard →</a></div>
    </div>`;
  attachTypeahead(document.getElementById("q"), document.getElementById("ac"));
}

/* ---------------- Detail render helpers (reused) ---------------- */
function ratioBar(r, maxv){
  const cv = parseFloat(String(r.company_value).replace(/[^0-9.\-]/g,""));
  const sv = parseFloat(String(r.sector_value).replace(/[^0-9.\-]/g,""));
  const w = v => isNaN(v)?0:Math.max(2,Math.min(100, Math.abs(v)/maxv*100));
  return `<div class="ratio"><div class="nm">${esc(r.name)}</div>
    <div class="bars"><div class="bar co"><span style="width:${w(cv)}%"></span></div>
      <div class="bar se"><span style="width:${w(sv)}%"></span></div></div>
    <div class="vals">${esc(r.company_value)} <span class="se">/ ${esc(r.sector_value)} sector</span></div></div>`;
}
function stmtTable(rows, cats, label){
  if(!rows||!rows.length) return "";
  const periods = (rows[0].history||[]).slice(0,5).map(h=>h.period);
  const head = `<tr><th>${label}</th>${periods.map(p=>`<th>${esc(p)}</th>`).join("")}</tr>`;
  const body = rows.filter(r=>!cats||cats.includes(r.category)).map(r=>{
    const cells=(r.history||[]).slice(0,5).map(h=>`<td>${fmtCr(h.value)}<br><small class="${chgClass(h.change)}">${esc(h.change||"")}</small></td>`).join("");
    return `<tr><td>${esc((r.category||"").replace(/_/g," "))}</td>${cells}</tr>`;
  }).join("");
  return `<table><thead>${head}</thead><tbody>${body}</tbody></table>`;
}
function balTable(bal){
  const h=(bal.history||[]).slice(0,5);
  if(!h.length) return '<div class="muted">—</div>';
  const head=`<tr><th>Item</th>${h.map(x=>`<th>${esc(x.period)}</th>`).join("")}</tr>`;
  const row=(lbl,k)=>`<tr><td>${lbl}</td>${h.map(x=>`<td>${fmtCr(x[k])}</td>`).join("")}</tr>`;
  return `<table><thead>${head}</thead><tbody>${row("Total assets","total_asset")}${row("Total liabilities","total_liability")}</tbody></table>`;
}
function holdings(list){
  if(!list||!list.length) return `<div class="muted">No shareholding data.</div>`;
  const latest = c => (c.history&&c.history[0])?c.history[0]:{value:null,period:""};
  return `<div class="hold">`+list.map(c=>{ const l=latest(c);
    return `<div class="hbar"><div class="nm">${esc(c.category)}</div>
      <div class="track"><span style="width:${Math.min(100,l.value||0)}%"></span></div>
      <div class="v">${l.value!=null?l.value.toFixed(2)+"%":"—"} <small>${esc(l.period)}</small></div></div>`;
  }).join("")+`</div>`;
}
function actions(list){
  if(!list||!list.length) return `<div class="muted">No recent corporate actions.</div>`;
  return list.slice(0,8).map(a=>{
    const ex=(a.event_details||[]).find(d=>/ex/i.test(d.name));
    const amt = a.amount?`₹${esc(a.amount)}`:esc(a.ratio||"");
    return `<div class="action"><span><b>${esc(a.name)}</b> ${ex?`· ex ${esc(ex.value)}`:(a.expiry_date?`· ${esc(a.expiry_date)}`:"")}</span><span class="amt">${amt}</span></div>`;
  }).join("");
}
function newsList(list){
  if(!list||!list.length) return `<div class="muted">No news in the past 7 days.</div>`;
  return `<div class="news">`+list.map(n=>{
    const t=new Date(parseInt(n.published_time)).toLocaleString("en-IN",{dateStyle:"medium",timeStyle:"short"});
    return `<a class="na" href="${esc(n.article_link)}" target="_blank" rel="noopener">
      ${n.thumbnail?`<img src="${esc(n.thumbnail)}" loading="lazy" onerror="this.style.display='none'"/>`:""}
      <div><div class="h">${esc(n.heading||"")}</div><div class="s">${esc(n.summary||"")}</div><div class="t">${t}</div></div></a>`;
  }).join("")+`</div>`;
}
function peerChip(c){ return `<span class="chip">${esc(c.name||c.instrument_key)}</span>`; }

function aiSection(ai){
  if(!ai) return "";
  if(!ai.available){
    return `<section class="ai"><h2>AI interpretation <span class="badge">beta</span></h2>
      <div class="muted">${esc(ai.reason||"Not available yet — check back shortly.")}</div></section>`;
  }
  const para=(t,txt)=> txt?`<h3>${t}</h3><p>${esc(txt)}</p>`:"";
  const pos=(ai.positives||[]).length?`<h3>What looks good</h3><ul class="poslist">${ai.positives.map(p=>`<li>${esc(p)}</li>`).join("")}</ul>`:"";
  return `<section class="ai">
    <h2>AI interpretation <span class="badge">beta</span></h2>
    ${ai.overview?`<p>${esc(ai.overview)}</p>`:""}
    ${para("Profit &amp; loss",ai.pnl)}
    ${para("Balance sheet",ai.balance_sheet)}
    ${para("Cash flow",ai.cash_flow)}
    ${pos}
    ${ai.provider?`<div class="prov">Generated by ${esc(ai.provider)} from the reported figures.</div>`:""}
  </section>`;
}
function warnSection(ai){
  if(!ai||!ai.available) return "";
  const ws=ai.warnings||[];
  if(!ws.length) return `<section><h2>Warning signs</h2>
    <div class="allclear">✓ No obvious red flags in the statements from the numbers reviewed.</div></section>`;
  const ic={high:"🔴",medium:"🟠",info:"🔵"};
  const order={high:0,medium:1,info:2};
  const sorted=[...ws].sort((a,b)=>(order[a.severity]??3)-(order[b.severity]??3));
  return `<section><h2>Warning signs · unusual items</h2><div class="warns">${
    sorted.map(w=>`<div class="warn ${w.severity}"><div class="ic">${ic[w.severity]||"🔵"}</div>
      <div><div class="wt">${esc(w.title||"Note")}</div>${w.detail?`<div class="wd">${esc(w.detail)}</div>`:""}</div></div>`).join("")
  }</div></section>`;
}

/* ---------------- Detail ---------------- */
function topbar(){
  return `<div class="topbar">
    <a class="home" href="?">Stock<span class="three60"> 360</span></a>
    <div class="minisearch"><input id="mq" autocomplete="off" spellcheck="false" placeholder="Search another stock…"/><div class="ac" id="mac"></div></div>
    <a class="home" href="${DASHBOARD_URL}" style="font-weight:600;font-size:.85rem">Dashboard →</a>
  </div>`;
}

async function renderStock(sym){
  document.title = `${sym} · Stock 360`;
  V.innerHTML = topbar() + `<div class="loading"><span class="spin"></span>
     Fetching ${esc(sym)} and analysing its financial statements… <br>
     <span class="muted">First look at a stock takes a few seconds; after that it's instant.</span></div>`;
  attachTypeahead(document.getElementById("mq"), document.getElementById("mac"));

  const d = await (await fetch(api(`/api/stock/${encodeURIComponent(sym)}`))).json();
  if(d.detail){ V.innerHTML = topbar() + `<div class="loading">${esc(d.detail)}</div>`; return; }

  const p = d.profile||{};
  const mcap = (p.sector_market_cap_inr&&p.sector_market_cap_inr.formatted)||"";
  const maxr = Math.max(...(d.ratios||[]).flatMap(r=>[r.company_value,r.sector_value]
    .map(v=>Math.abs(parseFloat(String(v).replace(/[^0-9.\-]/g,"")))||0)),1);
  const inc=d.income_statement||{}, bal=d.balance_sheet||{}, cf=d.cash_flow||{};

  V.innerHTML = topbar() + `
    <div class="updated">${esc(d.symbol)} · built ${esc(d._cached_at||d.generated_at||"")} IST ${d._cache==="hit"?"· cached":""}</div>
    <div class="head">
      <div class="sym">${esc(d.symbol)}</div><div class="nm">${esc(d.name||"")}</div>
      <div class="meta">
        <span>ISIN <b>${esc(d.isin)}</b></span>
        ${p.sector?`<span>Sector <b>${esc(p.sector)}</b></span>`:""}
        ${mcap?`<span>Sector mcap <b>${esc(mcap)}</b></span>`:""}
      </div>
      ${p.company_profile?`<p class="desc">${esc(p.company_profile)}</p>`:""}
    </div>

    ${warnSection(d.interpretation)}
    ${aiSection(d.interpretation)}

    <div class="cols">
      <section><h2>Key ratios · vs sector</h2>${(d.ratios||[]).map(r=>ratioBar(r,maxr)).join("")||'<div class="muted">—</div>'}</section>
      <section><h2>Shareholding · latest</h2>${holdings(d.share_holdings)}</section>
    </div>

    <section><h2>Income statement · ₹ ${esc(inc.units_in||"crore")} · ${esc(inc.type||"")}</h2>
      ${stmtTable(inc.income_statement, null, "P&L")||'<div class="muted">—</div>'}</section>

    <div class="cols">
      <section><h2>Balance sheet</h2>${balTable(bal)}</section>
      <section><h2>Cash flow</h2>${stmtTable(cf.cash_flow, null, "Flow")||'<div class="muted">—</div>'}</section>
    </div>

    <div class="cols">
      <section><h2>Corporate actions</h2>${actions(d.corporate_actions)}</section>
      <section><h2>Peers</h2><div class="chips">${(d.competitors||[]).map(c=>peerChip(c)).join("")||'<span class="muted">—</span>'}</div></section>
    </div>

    <section><h2>News · past 7 days</h2>${newsList(d.news)}</section>
    ${d.notes&&d.notes.length?`<div class="muted">Unavailable sections: ${esc(d.notes.join(", "))}</div>`:""}
  `;
}

route();
window.addEventListener("popstate", route);
</script>
</body>
</html>
