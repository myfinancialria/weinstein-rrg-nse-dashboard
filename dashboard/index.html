<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>myfinancial · Market overview</title>
<style>
  :root{
    --bg:#f7f8fa;--card:#ffffff;--ink:#0f172a;--muted:#64748b;--faint:#94a3b8;--line:#e6e9ef;
    --up:#16a34a;--down:#dc2626;--accent:#2563eb;--amber:#d97706;--soft:#f1f5f9;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 20px 70px}
  .status{display:flex;align-items:center;gap:10px;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--up);box-shadow:0 0 0 3px rgba(22,163,74,.15)}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin:8px 0 18px}
  h1{font-size:1.85rem;font-weight:800;letter-spacing:-.02em;margin:8px 0 0;max-width:22ch;text-wrap:balance}
  h1 .hl{color:var(--up)}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .btn{padding:8px 15px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:.83rem;color:var(--ink);white-space:nowrap}
  .btn:hover{text-decoration:none;border-color:var(--accent)}
  .btn.g{background:#dcfce7;border-color:#bbf7d0;color:#166534}
  .grid{display:grid;gap:16px}
  .g3{grid-template-columns:repeat(3,1fr)}
  .g2{grid-template-columns:1.1fr 1fr}
  @media(max-width:860px){.g3,.g2{grid-template-columns:1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  .lbl{font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600}
  .big{font-size:2rem;font-weight:800;letter-spacing:-.02em}
  .row{display:flex;justify-content:space-between;gap:10px;font-size:.86rem;padding:5px 0}
  .row .k{color:var(--muted)}.row .v{font-weight:700;font-variant-numeric:tabular-nums}
  .up{color:var(--up)}.down{color:var(--down)}.mut{color:var(--muted)}
  .advbar{height:8px;border-radius:5px;overflow:hidden;display:flex;margin:8px 0 12px;background:var(--down)}
  .advbar>span{background:var(--up);height:100%}
  .spark{width:100%;height:56px;display:block;margin:6px 0}
  table{width:100%;border-collapse:collapse;font-size:.85rem}
  th,td{text-align:right;padding:8px 8px;border-top:1px solid var(--line)}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--faint);font-size:.68rem;text-transform:uppercase;letter-spacing:.04em;border-top:none;font-weight:600}
  tbody tr:hover{background:var(--soft)}
  .sym{font-weight:700}.star{color:var(--faint);cursor:default}
  .pill{display:inline-block;font-size:.7rem;font-weight:600;padding:1px 8px;border-radius:999px}
  .pill.s2{background:#dcfce7;color:#166534}.pill.no{background:var(--soft);color:var(--muted)}
  .sect-title{font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-bottom:12px}
  .rrg{position:relative;width:100%;aspect-ratio:1/.82;background:var(--soft);border-radius:12px;overflow:hidden}
  .rrg .q{position:absolute;font-size:.62rem;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;font-weight:600;padding:6px 8px}
  .rrg .ax{position:absolute;background:var(--line)}
  .rrg .pt{position:absolute;width:11px;height:11px;border-radius:50%;transform:translate(-50%,-50%);border:2px solid #fff}
  .rrg .pt span{position:absolute;left:14px;top:-4px;font-size:.66rem;white-space:nowrap;color:var(--ink);font-weight:600}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.74rem;color:var(--muted);margin-top:10px}
  .legend i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:4px}
  .sect2{display:flex;gap:16px;flex-wrap:wrap}
  .sbox{flex:1;min-width:150px;background:var(--soft);border-radius:12px;padding:12px 14px}
  .foot{color:var(--faint);font-size:.75rem;margin-top:26px;border-top:1px solid var(--line);padding-top:14px}
  .muted{color:var(--muted)}
  .loading{padding:60px 0;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="wrap"><div class="loading">Loading the market…</div></div>

<script src="./api_config.js"></script>
<script>
const API=(window.API_BASE||"").replace(/\/$/,"");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num=n=>(n==null||isNaN(n))?"—":Number(n).toLocaleString("en-IN");
const pct=n=>(n==null||isNaN(n))?"—":(n>=0?"+":"")+Number(n).toFixed(2)+"%";
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const RRGC={leading:"#16a34a",improving:"#d97706",weakening:"#94a3b8",lagging:"#dc2626"};

Promise.all([
  fetch(API+"/api/universe/screen").then(r=>r.json()).catch(()=>null),
  fetch(API+"/api/market/pulse").then(r=>r.json()).catch(()=>null),
  fetch("market_blog.json?_="+Date.now()).then(r=>r.json()).catch(()=>null),
  fetch("dashboard_data.json?_="+Date.now()).then(r=>r.json()).catch(()=>null),
]).then(([U,P,BLOG,DD])=>render(U,P,BLOG,DD))
  .catch(e=>{document.getElementById("wrap").innerHTML=`<div class="loading">Couldn't load. ${esc(e.message)}</div>`;});

function sparkline(pairs){
  if(!pairs||pairs.length<2) return "";
  const v=pairs.map(p=>p[1]),mn=Math.min(...v),mx=Math.max(...v),sp=(mx-mn)||1,W=260,H=56;
  const pts=v.map((y,i)=>`${(W*i/(v.length-1)).toFixed(1)},${(H-((y-mn)/sp)*(H-6)-3).toFixed(1)}`).join(" ");
  const up=v[v.length-1]>=v[0],c=up?"var(--up)":"var(--down)";
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline fill="none" stroke="${c}" stroke-width="2" points="${pts}"/></svg>`;
}

function seasonalityHTML(SEA){
  if(!SEA||!SEA.monthly||!Object.keys(SEA.monthly).length) return "";
  const MN=["","Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const cm=SEA.current_month, cur=SEA.monthly[cm];
  const mx=Math.max(0.1,...Object.values(SEA.monthly).map(m=>Math.abs(m.avg)));
  const W=560,H=120; let bars="";
  for(let i=1;i<=12;i++){ const m=SEA.monthly[i]; const v=m?m.avg:0; const bw=W/12;
    const h=Math.abs(v)/mx*44, y0=H/2-8, x=(i-1)*bw+bw*0.18;
    const col=i===cm?"#2563eb":(v>=0?"#16a34a":"#dc2626");
    bars+=`<rect x="${x.toFixed(1)}" y="${(v>=0?y0-h:y0).toFixed(1)}" width="${(bw*0.64).toFixed(1)}" height="${Math.max(1,h).toFixed(1)}" rx="2" fill="${col}"><title>${MN[i]}: avg ${v>=0?'+':''}${v}% · up ${m?m.win:'—'}% of years</title></rect>`;
    bars+=`<text x="${(x+bw*0.32).toFixed(1)}" y="${H-4}" text-anchor="middle" font-size="9" fill="var(--faint)">${MN[i]}</text>`;
  }
  const svg=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto"><line x1="0" x2="${W}" y1="${(H/2-8)}" y2="${(H/2-8)}" stroke="var(--line)"/>${bars}</svg>`;
  const dow=SEA.dow||{};
  const dowh=Object.entries(dow).map(([k,v])=>`<span style="display:inline-block;margin-right:18px;font-size:.82rem"><b>${k}</b> <span class="${v.avg>=0?'up':'down'}">${v.avg>=0?'+':''}${v.avg}%</span> <span class="mut">up ${v.win}%</span></span>`).join("");
  return `<div class="card" style="margin-top:16px">
    <div class="sect-title">Seasonality · what usually happens (${SEA.years||"—"} yrs of NIFTY)</div>
    ${cur?`<div style="font-size:.95rem;margin-bottom:8px"><b>${MN[cm]}</b> historically: NIFTY finished up <b class="${cur.win>=50?'up':'down'}">${cur.win}%</b> of the last ${cur.n} years, average <b class="${cur.avg>=0?'up':'down'}">${cur.avg>=0?'+':''}${cur.avg}%</b>.</div>`:""}
    <div class="lbl" style="margin-bottom:2px">Average monthly return · blue = this month</div>
    ${svg}
    <div style="margin-top:10px"><span class="lbl" style="margin-right:10px">By weekday (10y)</span>${dowh}</div>
    <div class="mut" style="font-size:.75rem;margin-top:8px">Historical averages, not a forecast — past patterns often don't repeat.</div>
  </div>`;
}
function render(U,P,BLOG,DD){
  const wrap=document.getElementById("wrap");
  if(!U||!U.stocks||!U.stocks.length){ wrap.innerHTML=`<div class="loading">The market screener hasn't run yet on the server. Once <code>stock360 screen</code> completes, this fills in.</div>`; return; }
  const S=U.stocks, B=U.breadth||{}, tot=B.stage2_total||S.length, s2=B.stage2||0;
  const s2pct=Math.round(s2/tot*100);
  const read = s2pct>=50 ? "the widest participation in months." : s2pct>=33 ? "a healthy, selective market." : "a narrow, defensive market.";
  const mood = s2pct>=50?"RISK-ON · STAGE 2 BROADENING":s2pct>=33?"SELECTIVE · MIXED BREADTH":"DEFENSIVE · NARROW BREADTH";

  // industries
  const byI={}; S.forEach(s=>{const i=s.industry||"Other";(byI[i]=byI[i]||[]).push(s);});
  const inds=Object.entries(byI).map(([name,a])=>({name,n:a.length,
    rr:avg(a.map(s=>s.rs_ratio).filter(v=>v!=null)),
    rm:avg(a.map(s=>s.rs_momentum).filter(v=>v!=null)),
    chg:avg(a.map(s=>s.chg_pct).filter(v=>v!=null)),
    s2:a.filter(s=>s.stage==="stage_2").length}))
    .filter(i=>i.rr!=null);
  const bySect=[...inds].filter(i=>i.chg!=null).sort((x,y)=>y.chg-x.chg);
  const best=bySect[0], worst=bySect[bySect.length-1];
  const q=(rr,rm)=>rr>=100?(rm>=100?"leading":"weakening"):(rm>=100?"improving":"lagging");

  // top of screen
  const top=[...S].sort((a,b)=>(b.score||0)-(a.score||0)).slice(0,8);
  const niftyLine = P&&P.indices&&P.indices.nifty ? P.indices.nifty : [];
  const niftyLast = niftyLine.length?niftyLine[niftyLine.length-1][1]:null;
  const niftyChg = niftyLine.length>1?((niftyLast/niftyLine[niftyLine.length-2][1]-1)*100):null;
  const sxLine = P&&P.indices&&P.indices.sensex ? P.indices.sensex : [];
  const sxLast = sxLine.length?sxLine[sxLine.length-1][1]:null;
  const sxChg = sxLine.length>1?((sxLast/sxLine[sxLine.length-2][1]-1)*100):null;
  const gift = BLOG&&BLOG.gift_nifty ? BLOG.gift_nifty : null;
  const bt = DD&&DD.backtest&&DD.backtest.daily&&DD.backtest.daily.summary ? DD.backtest.daily.summary : null;

  // rrg positions (map rs_ratio ~96..104 and rs_momentum ~96..104 to 0..100%)
  const rrgPts = inds.map(i=>{
    const x=Math.max(2,Math.min(98,(i.rr-96)/8*100)), y=Math.max(2,Math.min(98,(i.rm-96)/8*100));
    return `<div class="pt" style="left:${x}%;top:${(100-y)}%;background:${RRGC[q(i.rr,i.rm)]}" title="${esc(i.name)}"><span>${esc(i.name)}</span></div>`;
  }).join("");
  const legc={};["leading","improving","weakening","lagging"].forEach(k=>legc[k]=inds.filter(i=>q(i.rr,i.rm)===k).length);

  wrap.innerHTML = `
    <div class="status"><span class="dot"></span> ${esc(mood)} · ${esc((U.generated_at||"").slice(0,10))} · post-close</div>
    <div class="top">
      <h1>${num(s2)} of ${num(tot)} names cleared Stage 2 — <span class="hl">${read}</span></h1>
      <div class="actions"><a class="btn g" href="screener.html">Open screener →</a><a class="btn" href="app-v2.html">Charts</a><a class="btn" href="stock.html">Search a stock</a></div>
    </div>

    <div class="grid g3">
      <div class="card">
        <div class="lbl">NIFTY 50</div>
        <div class="big">${num(niftyLast)} ${niftyChg!=null?`<span style="font-size:1rem" class="${niftyChg>=0?'up':'down'}">${pct(niftyChg)}</span>`:""}</div>
        ${sparkline(niftyLine)}
        <div class="row"><span class="k">Sensex</span><span class="v ${(sxChg||0)>=0?'up':'down'}">${num(sxLast)}${sxChg!=null?` ${pct(sxChg)}`:""}</span></div>
        <div class="row"><span class="k">Gift Nifty</span><span class="v ${gift&&gift.change_pct>=0?'up':'down'}">${gift?num(gift.level):"—"}</span></div>
      </div>
      <div class="card">
        <div class="lbl">Breadth · today</div>
        <div class="advbar"><span style="width:${Math.round((B.advances||0)/((B.advances||0)+(B.declines||1))*100)}%"></span></div>
        <div class="row"><span class="k">Advances</span><span class="v up">${num(B.advances)}</span></div>
        <div class="row"><span class="k">Declines</span><span class="v down">${num(B.declines)}</span></div>
        <div class="row"><span class="k">% above 30-week average</span><span class="v">${B.pct_above_30w_ma}%</span></div>
        <div class="row"><span class="k">New 52-week highs / lows</span><span class="v"><span class="up">${num(B.new_52w_highs)}</span> / <span class="down">${num(B.new_52w_lows)}</span></span></div>
      </div>
      <div class="card">
        <div class="lbl">Stage 2 universe</div>
        <div class="big up">${num(s2)} <span style="color:var(--faint);font-size:1rem;font-weight:600">/ ${num(tot)}</span></div>
        <div class="row"><span class="k">Share in a healthy uptrend</span><span class="v">${s2pct}%</span></div>
        <div class="row"><span class="k">Fresh 52-week-high breakouts</span><span class="v up">${num(B.new_52w_highs)}</span></div>
        <div class="mut" style="font-size:.8rem;margin-top:8px">A stock is "Stage 2" when its price is above a rising 30-week average and outperforming the market — the phase worth owning.</div>
      </div>
    </div>

    <div class="grid g2" style="margin-top:16px">
      <div class="card">
        <div class="sect-title">RRG · sectors vs the market <a href="sector-leadership.html" style="float:right;text-transform:none;letter-spacing:0;font-size:.72rem;font-weight:600">Full sector report →</a></div>
        <div class="rrg">
          <div class="ax" style="left:50%;top:0;bottom:0;width:1px"></div>
          <div class="ax" style="top:50%;left:0;right:0;height:1px"></div>
          <div class="q" style="right:0;top:0;color:var(--up)">Leading</div>
          <div class="q" style="left:0;top:0">Improving</div>
          <div class="q" style="left:0;bottom:0">Lagging</div>
          <div class="q" style="right:0;bottom:0">Weakening</div>
          ${rrgPts}
        </div>
        <div class="legend">
          <span><i style="background:${RRGC.leading}"></i>Leading ${legc.leading}</span>
          <span><i style="background:${RRGC.improving}"></i>Improving ${legc.improving}</span>
          <span><i style="background:${RRGC.weakening}"></i>Weakening ${legc.weakening}</span>
          <span><i style="background:${RRGC.lagging}"></i>Lagging ${legc.lagging}</span>
        </div>
      </div>
      <div class="card">
        <div class="sect-title">Top of the screen</div>
        <table><thead><tr><th>Symbol</th><th>Sector</th><th>LTP</th><th>RS</th><th>Chg</th><th>Stage</th></tr></thead>
          <tbody>${top.map(s=>`<tr>
            <td><span class="star">☆</span> <a class="sym" href="stock.html?symbol=${encodeURIComponent(s.symbol)}">${esc(s.symbol)}</a></td>
            <td class="mut">${esc(s.industry||"—")}</td>
            <td>${num(s.cmp)}</td>
            <td>${s.rs_ratio!=null?s.rs_ratio.toFixed(1):"—"}</td>
            <td class="${(s.chg_pct||0)>=0?'up':'down'}">${pct(s.chg_pct)}</td>
            <td>${s.stage==="stage_2"?'<span class="pill s2">Stage 2</span>':'<span class="pill no">—</span>'}</td>
          </tr>`).join("")}</tbody></table>
      </div>
    </div>

    <div class="grid g3" style="margin-top:16px">
      <div class="card">
        <div class="sect-title">Sector moves · today</div>
        <div class="sect2">
          <div class="sbox"><div class="lbl">Best</div><div style="font-weight:700;margin:2px 0">${best?esc(best.name):"—"}</div><div class="up" style="font-weight:700">${best?pct(best.chg):""}</div></div>
          <div class="sbox"><div class="lbl">Worst</div><div style="font-weight:700;margin:2px 0">${worst?esc(worst.name):"—"}</div><div class="down" style="font-weight:700">${worst?pct(worst.chg):""}</div></div>
        </div>
        <div class="mut" style="font-size:.78rem;margin-top:10px">Average move of all stocks in each sector.</div>
      </div>
      <div class="card">
        <div class="sect-title">Backtest · Stage-2 strategy</div>
        ${bt?`<div class="row"><span class="k">Win rate</span><span class="v">${bt.win_rate_pct}%</span></div>
        <div class="row"><span class="k">Total P&amp;L</span><span class="v ${(bt.total_pnl||0)>=0?'up':'down'}">₹${num(Math.round(bt.total_pnl))}</span></div>
        <div class="row"><span class="k">Max drawdown</span><span class="v down">₹${num(Math.round(bt.max_drawdown))}</span></div>
        <div class="row"><span class="k">Trades</span><span class="v">${bt.trade_count}</span></div>
        ${bt.avg_r_multiple!=null?`<div class="row"><span class="k">Avg reward : risk</span><span class="v">${Number(bt.avg_r_multiple).toFixed(2)}×</span></div>`:""}`:'<div class="mut">Backtest data loads from the daily build.</div>'}
      </div>
      <div class="card">
        <div class="sect-title">Morning brief</div>
        <div style="font-weight:700;margin-bottom:6px">${BLOG?esc(BLOG.headline||BLOG.title||"—"):"—"}</div>
        ${BLOG&&BLOG.cpr?`<div class="row"><span class="k">Pivot</span><span class="v">${num(BLOG.cpr.pivot)}</span></div>
        <div class="row"><span class="k">Resistance R1</span><span class="v">${num(BLOG.cpr.r1)}</span></div>
        <div class="row"><span class="k">Support S1</span><span class="v">${num(BLOG.cpr.s1)}</span></div>`:""}
        <a href="app-v2.html" style="font-size:.82rem">Full market blog →</a>
      </div>
    </div>

    <div id="oiBox"></div>
    ${seasonalityHTML(P&&P.seasonality)}

    <div class="foot">Screener over ${num(S.length)} NSE stocks · updated ${esc((U.generated_at||"").replace("T"," ").slice(0,16))}. Educational use only — not investment advice.</div>`;
  loadOI();
}
async function loadOI(){
  const box=document.getElementById("oiBox"); if(!box) return;
  try{
    const o=await (await fetch(API+"/api/market/oi")).json();
    if(!o||o.available===false){ box.innerHTML=""; return; }
    const read=o.pcr==null?"":(o.pcr>1?"put-heavy — downside protection being bought":o.pcr<0.7?"call-heavy — upside bets crowded":"balanced");
    box.innerHTML=`<div class="card" style="margin-top:16px">
      <div class="sect-title">NIFTY options · open interest${o.expiry?` · expiry ${esc(o.expiry)}`:""}</div>
      <div style="display:flex;gap:28px;flex-wrap:wrap">
        <div><div class="lbl">PCR</div><div class="big" style="font-size:1.5rem">${o.pcr??"—"}</div><div class="mut" style="font-size:.76rem">${read}</div></div>
        <div><div class="lbl">Max pain</div><div class="big" style="font-size:1.5rem">${num(o.max_pain)}</div></div>
        <div><div class="lbl">Spot</div><div class="big" style="font-size:1.5rem">${num(o.spot)}</div></div>
        <div><div class="lbl">Call OI / Put OI</div><div style="font-weight:700;margin-top:8px;font-variant-numeric:tabular-nums">${num(o.total_call_oi)} / ${num(o.total_put_oi)}</div></div>
      </div>
      <div class="mut" style="font-size:.75rem;margin-top:8px">PCR = Put ÷ Call open interest (higher = more downside protection bought). Max pain = the strike where most options expire worthless; price often gravitates there near expiry.</div>
    </div>`;
  }catch(e){ box.innerHTML=""; }
}
</script>
</body>
</html>
