<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>myfinancial · NSE stocks in plain English</title>
<style>
  :root{
    --bg:#0d1117;--panel:#161b22;--panel2:#1c2230;--border:#2b3446;--text:#e6edf3;--muted:#8b98a9;
    --accent:#4c8dff;--good:#2ea043;--bad:#e5534b;--amber:#d29922;--chip:#22283a;
    --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;
  }
  @media (prefers-color-scheme:light){:root{--bg:#f6f8fa;--panel:#fff;--panel2:#eef2f7;--border:#d5dbe2;
    --text:#1c2128;--muted:#5b6570;--chip:#eef2f7;--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;}}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.5;-webkit-font-smoothing:antialiased}
  a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
  .wrap{max-width:1080px;margin:0 auto;padding:0 18px 80px}
  /* header */
  header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
    backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
  .hbar{max-width:1080px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{font-weight:800;font-size:1.15rem;letter-spacing:-.02em;white-space:nowrap}
  .brand b{color:var(--accent)}
  .hsearch{position:relative;flex:1;min-width:200px;max-width:440px}
  .hsearch input{width:100%;padding:9px 14px;border-radius:999px;border:1px solid var(--border);
    background:var(--panel);color:var(--text);font-size:.9rem}
  .ac{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--border);
    border-radius:14px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.28);display:none;z-index:9}
  .ac.open{display:block}
  .aci{display:flex;gap:10px;align-items:center;padding:9px 14px;cursor:pointer;border-top:1px solid var(--border)}
  .aci:first-child{border-top:none}.aci.active,.aci:hover{background:var(--panel2)}
  .aci .sym{font-weight:700;min-width:88px}.aci .nm{color:var(--muted);font-size:.84rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hlink{font-size:.82rem;color:var(--muted);white-space:nowrap}
  nav.sub{display:flex;gap:4px;overflow-x:auto;padding:4px 0 0}
  nav.sub a{padding:7px 13px;border-radius:9px;font-size:.85rem;color:var(--muted);white-space:nowrap}
  nav.sub a.on{background:var(--panel);color:var(--text);font-weight:600}
  /* hero */
  .hero{text-align:center;padding:34px 0 10px}
  .hero h1{font-size:1.7rem;font-weight:800;letter-spacing:-.02em;margin:0 0 6px;text-wrap:balance}
  .hero p{color:var(--muted);margin:0;font-size:.95rem}
  /* sections */
  section.blk{margin-top:34px;scroll-margin-top:110px}
  .blk h2{font-size:1.15rem;font-weight:750;letter-spacing:-.01em;margin:0 0 3px}
  .blk .sub{color:var(--muted);font-size:.86rem;margin:0 0 14px}
  .grid{display:grid;gap:12px}
  .g3{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
  .g2{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:15px 16px;
    display:block;transition:border-color .14s,transform .05s}
  a.card:hover{border-color:var(--accent);text-decoration:none;transform:translateY(-1px)}
  .card .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .card .sym{font-weight:750;font-size:1.05rem}
  .card .nm{color:var(--muted);font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  .card .biz{color:var(--muted);font-size:.8rem;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .badge{display:inline-block;font-size:.68rem;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
  .badge.up{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
  .badge.mid{background:color-mix(in srgb,var(--amber) 16%,transparent);color:var(--amber)}
  .badge.low{background:var(--chip);color:var(--muted)}
  .trade{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:12px;font-size:.8rem}
  .trade div{background:var(--panel2);border-radius:9px;padding:6px 8px}
  .trade .l{color:var(--muted);font-size:.64rem;text-transform:uppercase;letter-spacing:.03em}
  .trade .v{font-weight:700;font-variant-numeric:tabular-nums}
  .meter{height:7px;border-radius:5px;background:var(--panel2);overflow:hidden;margin-top:12px}
  .meter>span{display:block;height:100%;border-radius:5px}
  .metrow{display:flex;justify-content:space-between;gap:8px;margin-top:5px;font-size:.7rem;color:var(--muted)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .chip{background:var(--chip);border:1px solid var(--border);border-radius:999px;padding:2px 10px;font-size:.75rem;color:var(--muted)}
  .funds{display:flex;flex-wrap:wrap;gap:5px 16px;margin-top:12px;font-size:.8rem}
  .funds span{color:var(--muted)}.funds b{color:var(--text)}
  /* market today */
  .mood{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .moodt{flex:1;min-width:120px;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px}
  .moodt .l{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .moodt .v{font-size:1.7rem;font-weight:800;margin-top:2px}
  .levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:9px}
  .lvl{background:var(--panel2);border:1px solid var(--border);border-radius:11px;padding:9px 11px}
  .lvl .l{font-size:.66rem;color:var(--muted);text-transform:uppercase}
  .lvl .v{font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
  .note{color:var(--muted);font-size:.86rem;margin-top:12px}
  /* track record */
  .track{background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:16px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin:12px 0}
  .kpi{background:var(--panel2);border-radius:11px;padding:10px 12px}
  .kpi .l{font-size:.66rem;color:var(--muted);text-transform:uppercase}
  .kpi .v{font-size:1.25rem;font-weight:800;font-variant-numeric:tabular-nums;margin-top:2px}
  .eq svg{width:100%;height:auto;display:block}
  details{margin-top:10px}summary{cursor:pointer;color:var(--accent);font-size:.85rem}
  .tt{border-bottom:1px dotted var(--muted);cursor:help}
  .muted{color:var(--muted)} .pos{color:var(--good)}.neg{color:var(--bad)}
  .gloss{columns:2;column-gap:26px;font-size:.85rem}
  @media(max-width:640px){.gloss{columns:1}}
  .gloss div{break-inside:avoid;margin-bottom:8px}.gloss b{color:var(--text)}
  footer{margin-top:44px;color:var(--muted);font-size:.76rem;border-top:1px solid var(--border);padding-top:16px}
</style>
</head>
<body>
<header>
  <div class="hbar">
    <div class="brand">my<b>financial</b></div>
    <div class="hsearch"><input id="q" autocomplete="off" spellcheck="false" placeholder="Search any NSE stock…" /><div class="ac" id="ac"></div></div>
    <a class="hlink" href="browse.html">Browse by size</a>
    <a class="hlink" href="app.html">Advanced view →</a>
  </div>
  <div class="hbar" style="padding-top:0;padding-bottom:6px"><nav class="sub" id="nav"></nav></div>
</header>

<div class="wrap">
  <div class="hero">
    <h1>NSE stocks in a healthy uptrend — in plain English</h1>
    <p id="heroSub">Loading today's picks…</p>
  </div>
  <div id="view"><div class="note" style="text-align:center;padding:40px">Loading…</div></div>
  <footer id="foot"></footer>
</div>

<script>
const num = n => (n===null||n===undefined||n===""||isNaN(n))?"—":Number(n).toLocaleString("en-IN");
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const rup = v => (v==null||isNaN(v))?"—":"₹"+num(Math.round(v));
const cr = v => (v==null||isNaN(v))?"—":(Math.abs(v)>=100000?(v/100000).toFixed(2)+"L Cr":num(Math.round(v))+" Cr");
const sign = v => (v==null||isNaN(v))?"—":(v>=0?"+":"")+Number(v).toFixed(1)+"%";
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));

const STAGE = s => s==="stage_2" ? {t:"Healthy uptrend",c:"up"} : (s==="data_error"?{t:"—",c:"low"}:{t:"Not in uptrend",c:"low"});
const RRG = q => ({leading:{t:"Strong & strengthening",c:"up"},improving:{t:"Turning up",c:"mid"},
  weakening:{t:"Strong but fading",c:"mid"},lagging:{t:"Weak",c:"low"}}[q]||{t:"—",c:"low"});
const tip=(txt,label)=>`<span class="tt" title="${esc(txt)}">${esc(label)}</span>`;

let DATA=null, BLOG=null;

Promise.all([
  fetch("dashboard_data.json?_="+Date.now()).then(r=>r.json()),
  fetch("market_blog.json?_="+Date.now()).then(r=>r.json()).catch(()=>null),
]).then(([d,b])=>{ DATA=d; BLOG=b; render(); })
  .catch(e=>{ document.getElementById("view").innerHTML=`<div class="note" style="text-align:center;padding:40px">Couldn't load data. ${esc(e.message)}</div>`; });

/* ---------- stock card ---------- */
function strengthPct(s, maxScore){ return clamp((s||0)/(maxScore||1)*100, 3, 100); }
function stockCard(s, maxScore){
  const st=STAGE(s.stage), rg=RRG(s.rrg_quadrant);
  const biz = s.common_product_business || s.yahoo_industry || s.parent || "";
  const hasTrade = s.entry_price!=null && s.sl!=null && s.target!=null;
  return `<a class="card" href="index.html?symbol=${encodeURIComponent(s.display_symbol||s.symbol)}">
    <div class="top"><div><div class="sym">${esc(s.display_symbol||s.symbol)}</div>
      <div class="nm">${esc(s.name||"")}</div></div>
      <span class="badge ${st.c}">${st.t}</span></div>
    ${biz?`<div class="biz">${esc(biz)}</div>`:""}
    ${hasTrade?`<div class="trade">
      <div><div class="l">${tip("A sensible price to buy near","Buy near")}</div><div class="v">${rup(s.entry_price)}</div></div>
      <div><div class="l">${tip("Exit if it falls below this — limits loss","Exit below")}</div><div class="v">${rup(s.sl)}</div></div>
      <div><div class="l">${tip("A reasonable profit goal","Target")}</div><div class="v">${rup(s.target)}</div></div>
    </div>`:""}
    <div class="meter"><span style="width:${strengthPct(s.stock_score,maxScore)}%;background:var(--s1)"></span></div>
    <div class="metrow"><span>${tip("Overall technical strength of the setup — higher is stronger","Strength")}</span>
      <span>${rg.t}${s.return_1y!=null?` · <span class="${s.return_1y>=0?'pos':'neg'}">${sign(s.return_1y)} in 1yr</span>`:""}</span></div>
  </a>`;
}
/* ---------- quality (fundamental) card ---------- */
function qualityCard(s){
  const biz=s.common_product_business||s.yahoo_industry||s.parent||"";
  const fs=s.fundamental_score||0;
  const col=fs>=70?"var(--good)":fs>=50?"var(--amber)":"var(--muted)";
  return `<a class="card" href="index.html?symbol=${encodeURIComponent(s.display_symbol||s.symbol)}">
    <div class="top"><div><div class="sym">${esc(s.display_symbol||s.symbol)}</div>
      <div class="nm">${esc(s.name||"")}</div></div>
      <span class="badge ${fs>=70?'up':fs>=50?'mid':'low'}">Quality ${Math.round(fs)}/100</span></div>
    ${biz?`<div class="biz">${esc(biz)}</div>`:""}
    <div class="meter"><span style="width:${clamp(fs,3,100)}%;background:${col}"></span></div>
    <div class="funds">
      ${s.pe_ratio!=null?`<span>${tip("Price ÷ yearly profit per share — how pricey the stock is","P/E")} <b>${Number(s.pe_ratio).toFixed(1)}</b></span>`:""}
      ${s.roce!=null?`<span>${tip("Return on capital employed — how well it uses money (higher better)","ROCE")} <b>${Number(s.roce).toFixed(1)}%</b></span>`:""}
      ${s.roe_pct!=null?`<span>${tip("Return on equity — profit on owners' money","ROE")} <b>${Number(s.roe_pct).toFixed(1)}%</b></span>`:""}
      ${s.net_margin_pct!=null?`<span>${tip("Profit kept from every ₹100 of sales","Margin")} <b>${Number(s.net_margin_pct).toFixed(1)}%</b></span>`:""}
      ${s.debt_to_equity!=null?`<span>${tip("Debt vs owners' money — lower is safer","D/E")} <b>${Number(s.debt_to_equity).toFixed(2)}</b></span>`:""}
    </div>
    ${(s.fundamental_reasons||[]).length?`<div class="chips">${s.fundamental_reasons.map(r=>`<span class="chip">${esc(r)}</span>`).join("")}</div>`:""}
  </a>`;
}

/* ---------- sections ---------- */
function marketToday(){
  if(!BLOG) return "";
  const p=BLOG.probabilities||{}, n=BLOG.nifty||{}, c=BLOG.cpr||{};
  const mood = (p.up>=p.down&&p.up>=p.sideways)?"Leaning up":(p.down>=p.up&&p.down>=p.sideways)?"Leaning down":"Sideways";
  const lvl=(l,v)=>`<div class="lvl"><div class="l">${l}</div><div class="v">${num(Math.round(v))}</div></div>`;
  return `<section class="blk" id="sec-market"><h2>Market today</h2>
    <div class="sub">${esc(BLOG.headline||"How the overall market looks right now.")}</div>
    <div class="mood">
      <div class="moodt"><div class="l">Market mood</div><div class="v">${mood}</div></div>
      <div class="moodt"><div class="l">Chance up</div><div class="v pos">${p.up??"—"}%</div></div>
      <div class="moodt"><div class="l">Chance down</div><div class="v neg">${p.down??"—"}%</div></div>
      <div class="moodt"><div class="l">Sideways</div><div class="v">${p.sideways??"—"}%</div></div>
    </div>
    <div class="card">
      <div class="top"><div class="sym">NIFTY 50 &nbsp;<span class="nm">${num(n.close)}</span></div>
        <span class="badge ${(n.change_5d_pct||0)>=0?'up':'low'}">${sign(n.change_5d_pct)} · 5 days</span></div>
      <div class="funds" style="margin-top:10px">
        ${n.rsi14!=null?`<span>${tip("Momentum gauge 0–100; under 30 = oversold, over 70 = overbought","Momentum (RSI)")} <b>${Number(n.rsi14).toFixed(0)}</b></span>`:""}
        ${n.ma50!=null&&n.close!=null?`<span>vs medium-term average <b class="${n.close>=n.ma50?'pos':'neg'}">${n.close>=n.ma50?"above":"below"}</b></span>`:""}
        ${n.ma200!=null&&n.close!=null?`<span>vs long-term average <b class="${n.close>=n.ma200?'pos':'neg'}">${n.close>=n.ma200?"above":"below"}</b></span>`:""}
      </div>
      <div class="note" style="margin-top:12px;font-size:.78rem">Key levels for tomorrow (where price may pause):</div>
      <div class="levels" style="margin-top:8px">
        ${c.s2!=null?lvl("Strong support",c.s2):""}${c.s1!=null?lvl("Support",c.s1):""}
        ${c.pivot!=null?lvl("Pivot",c.pivot):""}${c.r1!=null?lvl("Resistance",c.r1):""}${c.r2!=null?lvl("Strong resistance",c.r2):""}
      </div>
    </div></section>`;
}
function sectors(){
  const arr=(DATA.leadingIndustries||[]);
  if(!arr.length) return "";
  const maxrs=Math.max(...arr.map(i=>Math.abs((i.rs_ratio||100)-100)),1);
  const cards=arr.map(i=>{ const rg=RRG(i.rrg_quadrant);
    return `<div class="card"><div class="top"><div><div class="sym" style="font-size:.98rem">${esc(i.name)}</div>
      <div class="nm">${esc(i.parent||"")} · ${i.member_count||0} companies</div></div>
      <span class="badge ${rg.c}">${rg.t}</span></div>
      <div class="meter"><span style="width:${clamp(Math.abs((i.rs_ratio||100)-100)/maxrs*100,4,100)}%;background:var(--s3)"></span></div>
      <div class="metrow"><span>${tip("How strong this sector is vs the whole market","Strength vs market")}</span>
        <span>${(i.rs_ratio||0)>100?"beating market":"lagging market"}</span></div></div>`;
  }).join("");
  return `<section class="blk" id="sec-sectors"><h2>Strongest areas right now</h2>
    <div class="sub">Industries doing best versus the overall market — a rising tide for the stocks inside them.</div>
    <div class="grid g3">${cards}</div></section>`;
}
function bestStocks(arr){
  arr=arr||(DATA.leadingStocks||[]);
  if(!arr.length) return "";
  const maxScore=Math.max(...arr.map(s=>s.stock_score||0),1);
  return `<section class="blk" id="sec-best"><h2>Best stocks now</h2>
    <div class="sub">In a healthy uptrend inside the strongest sectors — the financially-strongest are grouped under Quality picks below. Buy/exit/target are guides, not advice.</div>
    <div class="grid g2">${arr.slice(0,24).map(s=>stockCard(s,maxScore)).join("")}</div>
    ${arr.length>24?`<div class="note">Showing 24 of ${arr.length}. <a href="app.html">See all in the advanced view →</a></div>`:""}</section>`;
}
function quality(arr){
  arr=arr||(DATA.fundamentalPicks||[]);
  if(!arr.length) return "";
  return `<section class="blk" id="sec-quality"><h2>Financially strong companies</h2>
    <div class="sub">Picked for solid financials — good returns on capital, healthy margins, manageable debt.</div>
    <div class="grid g2">${arr.slice(0,18).map(qualityCard).join("")}</div></section>`;
}
function breakouts(arr){
  arr=arr||(DATA.breakout52wStocks||[]);
  if(!arr.length) return "";
  const cards=arr.map(s=>{ const biz=s.common_product_business||s.yahoo_industry||"";
    return `<a class="card" href="index.html?symbol=${encodeURIComponent(s.display_symbol||s.symbol)}">
      <div class="top"><div><div class="sym">${esc(s.display_symbol||s.symbol)}</div><div class="nm">${esc(s.name||"")}</div></div>
        <span class="badge up">${sign(s.pct_above_52wh)} above</span></div>
      ${biz?`<div class="biz">${esc(biz)}</div>`:""}
      <div class="funds"><span>Price <b>${rup(s.cmp)}</b></span><span>1-yr high <b>${rup(s.high_52w)}</b></span>
        ${s.breakout_week?`<span>Broke out <b>${esc(s.breakout_week)}</b></span>`:""}</div></a>`;
  }).join("");
  return `<section class="blk" id="sec-breakouts"><h2>Just hit a 1-year high</h2>
    <div class="sub">Stocks closing above their highest price in a year — a classic sign of fresh strength.</div>
    <div class="grid g2">${cards}</div></section>`;
}
function equitySVG(pts){
  const eq=pts.map(p=>p.equity).filter(v=>v!=null); if(eq.length<2) return "";
  const W=760,H=140,min=Math.min(...eq),max=Math.max(...eq),span=(max-min)||1;
  const x=i=>W*i/(eq.length-1), y=v=>H-((v-min)/span)*(H-8)-4;
  const line=eq.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const up=eq[eq.length-1]>=eq[0], col=up?"var(--good)":"var(--bad)";
  return `<div class="eq"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-label="equity curve">
    <defs><linearGradient id="eg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${col}" stop-opacity=".2"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
    <polygon fill="url(#eg)" points="0,${H} ${line} ${W},${H}"/>
    <polyline fill="none" stroke="${col}" stroke-width="2" points="${line}"/></svg></div>`;
}
function trackCard(bt, title, blurb){
  if(!bt||!bt.summary) return "";
  const s=bt.summary;
  return `<div class="track"><h2 style="font-size:1rem">${esc(title)}</h2>
    <div class="sub">${esc(blurb)}</div>
    <div class="kpis">
      <div class="kpi"><div class="l">${tip("Share of trades that made money","Win rate")}</div><div class="v">${s.win_rate_pct!=null?s.win_rate_pct+"%":"—"}</div></div>
      <div class="kpi"><div class="l">Total result</div><div class="v ${(s.total_pnl||0)>=0?'pos':'neg'}">${rup(s.total_pnl)}</div></div>
      <div class="kpi"><div class="l">${tip("Worst peak-to-dip fall along the way","Worst dip")}</div><div class="v neg">${rup(s.max_drawdown)}</div></div>
      <div class="kpi"><div class="l">Trades</div><div class="v">${s.trade_count??"—"}</div></div>
      ${s.avg_r_multiple!=null?`<div class="kpi"><div class="l">${tip("Average reward vs the risk taken per trade","Avg reward:risk")}</div><div class="v">${Number(s.avg_r_multiple).toFixed(2)}×</div></div>`:""}
    </div>
    ${equitySVG(bt.equityCurve||[])}
    ${s.rules?`<details><summary>The rule behind it</summary><div class="note">${esc(s.rules)}</div></details>`:""}
  </div>`;
}
function trackRecord(){
  const cards=[
    trackCard(DATA.backtest&&DATA.backtest.daily,"Daily uptrend strategy","Buys stocks entering a healthy uptrend on the daily chart, exits when the trend breaks. Past results below."),
    trackCard(DATA.backtest&&DATA.backtest.weekly,"Weekly uptrend strategy","Same idea on the slower weekly chart — fewer, longer trades."),
    trackCard(DATA.backtest52w,"1-year-high breakout","Buys fresh 52-week-high breakouts, trails the exit at the 52-week average."),
  ].filter(Boolean).join("");
  if(!cards) return "";
  return `<section class="blk" id="sec-track"><h2>How these ideas performed</h2>
    <div class="sub">Back-tested on past NSE data. Past performance doesn't guarantee future results.</div>
    <div class="grid g2">${cards}</div></section>`;
}
function glossary(){
  const g=[
    ["Healthy uptrend","The stock's price is in a strong, rising phase — the kind worth owning."],
    ["Strength vs market","How the stock/sector is doing compared with the whole market."],
    ["Buy near / Exit below / Target","A sensible entry, a stop to limit loss, and a profit goal."],
    ["Quality score","0–100 rating of the company's financial health (profits, debt, growth)."],
    ["P/E","Price ÷ yearly profit per share — how expensive the stock is."],
    ["ROCE / ROE","How well the business turns money into profit (higher is better)."],
    ["Margin","Profit kept from each ₹100 of sales."],
    ["D/E","Debt compared with owners' money — lower is safer."],
    ["Win rate","Share of past trades that made money."],
    ["Worst dip (drawdown)","The biggest fall from a peak the strategy went through."],
  ];
  return `<section class="blk" id="sec-help"><h2>What the words mean</h2>
    <div class="gloss">${g.map(([t,d])=>`<div><b>${esc(t)}</b> — ${esc(d)}</div>`).join("")}</div></section>`;
}

/* ---------- assemble + nav ---------- */
const SECTIONS=[
  ["sec-market","Market"],["sec-sectors","Strong areas"],["sec-best","Best stocks"],
  ["sec-quality","Quality picks"],["sec-breakouts","Breakouts"],["sec-track","Track record"],["sec-help","Glossary"],
];
function render(){
  const m=DATA.metrics||{};
  document.getElementById("heroSub").textContent =
    `${m.stage2_leading_stocks||m.stocks_analyzed||""} strong stocks across ${m.stage2_leading_industries||""} leading sectors · updated ${(m.generated_at||"").slice(0,16).replace("T"," ")}`;
  // De-duplicate across the stock sections: each stock appears once, by priority
  // Quality picks (uptrend + strong financials) > Breakouts (timely) > other leaders.
  const key=s=>(s.display_symbol||s.symbol), used=new Set();
  const qp=(DATA.fundamentalPicks||[]); qp.forEach(s=>used.add(key(s)));
  const brk=(DATA.breakout52wStocks||[]).filter(s=>!used.has(key(s))); brk.forEach(s=>used.add(key(s)));
  const best=(DATA.leadingStocks||[]).filter(s=>!used.has(key(s)));
  document.getElementById("view").innerHTML =
    marketToday()+sectors()+bestStocks(best)+quality(qp)+breakouts(brk)+trackRecord()+glossary();
  document.getElementById("nav").innerHTML =
    SECTIONS.filter(([id])=>document.getElementById(id)).map(([id,l])=>`<a href="#${id}" data-id="${id}">${l}</a>`).join("");
  document.getElementById("foot").innerHTML =
    `Data via public NSE/Yahoo/Upstox sources; scores are computed, AI notes can contain mistakes. <b>Educational use only — not investment advice.</b> · <a href="app.html">Advanced view</a> · <a href="index.html">Stock search</a>`;
  buildSearch(); wireNav();
}
function wireNav(){
  const links=[...document.querySelectorAll("#nav a")];
  links.forEach(a=>a.addEventListener("click",e=>{e.preventDefault();
    document.getElementById(a.dataset.id).scrollIntoView({behavior:"smooth"});}));
  const secs=links.map(a=>document.getElementById(a.dataset.id));
  const obs=new IntersectionObserver(es=>{es.forEach(en=>{ if(en.isIntersecting){
    links.forEach(a=>a.classList.toggle("on",a.dataset.id===en.target.id)); }});},{rootMargin:"-45% 0px -50% 0px"});
  secs.forEach(s=>s&&obs.observe(s));
}
function buildSearch(){
  const seen=new Set(), all=[];
  (DATA.stocks||[]).forEach(s=>{ const sym=s.display_symbol||s.symbol; if(sym&&!seen.has(sym)){seen.add(sym);
    all.push({sym,name:s.name||"",hay:((sym+" "+(s.name||"")+" "+(s.parent||"")+" "+(s.common_product_business||"")).toLowerCase())});}});
  const input=document.getElementById("q"), ac=document.getElementById("ac");
  let items=[],active=-1;
  const close=()=>{ac.classList.remove("open");active=-1;};
  const go=it=>{ if(it) location.href="index.html?symbol="+encodeURIComponent(it.sym); };
  const rnd=()=>{ if(!items.length){close();return;}
    ac.innerHTML=items.map((it,i)=>`<div class="aci ${i===active?'active':''}" data-i="${i}"><span class="sym">${esc(it.sym)}</span><span class="nm">${esc(it.name)}</span></div>`).join("");
    ac.classList.add("open");
    ac.querySelectorAll(".aci").forEach(el=>el.addEventListener("mousedown",e=>{e.preventDefault();go(items[+el.dataset.i]);}));};
  input.addEventListener("input",()=>{ const t=input.value.trim().toLowerCase(); if(!t){items=[];close();return;}
    items=all.filter(x=>x.hay.includes(t)).sort((a,b)=>a.sym.localeCompare(b.sym)).slice(0,10); active=-1; rnd();});
  input.addEventListener("keydown",e=>{ if(!items.length)return;
    if(e.key==="ArrowDown"){e.preventDefault();active=(active+1)%items.length;rnd();}
    else if(e.key==="ArrowUp"){e.preventDefault();active=(active-1+items.length)%items.length;rnd();}
    else if(e.key==="Enter"){e.preventDefault();go(items[active>=0?active:0]);}
    else if(e.key==="Escape")close(); });
  input.addEventListener("blur",()=>setTimeout(close,150));
}
</script>
